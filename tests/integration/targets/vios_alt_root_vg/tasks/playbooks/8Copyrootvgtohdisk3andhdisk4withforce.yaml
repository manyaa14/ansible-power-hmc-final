---
- name: Copy rootvg to hdisk3 and hdisk4 with force (switching from hdisk1/hdisk2)
  block:
    - name: Set hdisk3 and hdisk4 as alt_rootvg with force=true
      vios_alt_root_vg:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vios_name: "{{ vios_name }}"
        force: true
        targets:
          - "{{ target_disk3 }}"
          - "{{ target_disk4 }}"
        state: copy
      register: result

    - name: Display result
      debug:
        msg: "{{ result }}"

    - assert:
        that:
          - result is success
          - result is changed

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

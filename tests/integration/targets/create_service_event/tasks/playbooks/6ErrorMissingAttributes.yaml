---
- name: "TC6 - Error: missing attributes"
  block:
    - name: Run create_service_event without attributes
      create_service_event:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        description: "Test Description"
        types: vios
        state: created
      register: result
      ignore_errors: true

    - name: Verify task failed with missing attributes error
      assert:
        that:
          - result is failed
          - result is not changed
          - "'attributes' in result.msg"
        fail_msg: "{{ Status_Fail }}"
  rescue:
    - name: Testcase failed
      debug:
        msg: "{{ Status_Fail }}"

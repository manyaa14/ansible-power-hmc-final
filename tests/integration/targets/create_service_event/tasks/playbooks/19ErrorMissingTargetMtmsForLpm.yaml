---
- name: "TC19 - Error: target_mtms not provided when type is lpm"
  block:
    - name: Run create_service_event without target_mtms for types lpm
      create_service_event:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        description: "Test Description"
        types: lpm
        attributes:
          title: "{{ svc_title }}"
          severity: "{{ svc_severity }}"
          contact_name: "{{ svc_contact_name }}"
          contact_phone: "{{ svc_contact_phone }}"
          contact_email: "{{ svc_contact_email }}"
          lpar_name: "{{ vios_name }}"
          target_lpar_name: "{{ target_lpar_name }}"
          service_file:
            - pedbgq4
        state: created
      register: result
      ignore_errors: true

    - name: Verify task failed with target_mtms mandatory for lpm error
      assert:
        that:
          - result is failed
          - result is not changed
          - "'target_mtms' in result.msg"
        fail_msg: "{{ Status_Fail }}"
  rescue:
    - name: Testcase failed
      debug:
        msg: "{{ Status_Fail }}"

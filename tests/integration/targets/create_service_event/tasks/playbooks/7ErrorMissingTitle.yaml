---
- name: "TC7 - Error: missing title in attributes"
  block:
    - name: Run create_service_event without title in attributes
      create_service_event:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        description: "Test Description"
        types: vios
        attributes:
          severity: "{{ svc_severity }}"
          contact_name: "{{ svc_contact_name }}"
          contact_phone: "{{ svc_contact_phone }}"
          contact_email: "{{ svc_contact_email }}"
          lpar_name: "{{ vios_name }}"
          service_file:
            - pedbgq4
        state: created
      register: result
      ignore_errors: true

    - name: Verify task failed with missing title error
      assert:
        that:
          - result is failed
          - result is not changed
          - "'title' in result.msg"
        fail_msg: "{{ Status_Fail }}"
  rescue:
    - name: Testcase failed
      debug:
        msg: "{{ Status_Fail }}"

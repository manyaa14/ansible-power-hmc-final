---
- name: Create a local HMC User
  block:
    - name: Create hmc local user
      hmc_user:
        state: present
        hmc_host: "{{ inventory_hostname }}"
        name: "{{ name }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        attributes:
          resourcerole: "{{ resourcerole }}"
          authentication_type: "{{ authentication_type }}"
          passwd: "{{ passwd }}"
          taskrole: "{{ taskrole }}"
      register: result

    - name: Output Users
      debug:
        msg: "{{ result }}"

    - name: Verify that user gets created
      assert:
        that:
          - result is success
          - result is changed

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ status_fail }}"

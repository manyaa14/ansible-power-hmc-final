---
- name: List User Facts
  block:
    - name: User Facts
      hmc_user:
        state: facts
        hmc_host: "{{ inventory_hostname }}"
        name: "{{ kerberosusername }}"
        hmc_auth: "{{ curr_hmc_auth }}"
      register: result

    - name: Output Users
      debug:
        msg: "{{ result }}"

    - assert:
        that:
          - result is success
          - result is not changed

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ status_fail }}"

---
- name: Error when ldap_settings,resource,ldap_resource mentioned for absent state
  block:
    - name: Error when ldap_settings,resource,ldap_resource mentioned for absent state
      hmc_user:
        state: absent
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        ldap_settings:
          primary: "{{ primary }}"
          binddn: "{{ binddn }}"
          basedn: "{{ basedn }}"
          bindpw: "{{ bindpw }}"
          automanage: "{{ automanage }}"
          backup: "{{ backup }}"
          timelimit: "{{ timelimit }}"
          bindtimelimit: "{{ bindtimelimit }}"
          hmcauthnameattribute: "{{ hmcauthnameattribute }}"
        resource: "{{ resource_user }}"
        ldap_resource: "{{ ldap_resource_bindpw }}"
      register: result
      ignore_errors: yes

    - name: Verify the error message
      assert:
        that:
          - "'ParameterError: unsupported parameters: resource,ldap_settings,ldap_resource' in result.msg"
          - result is not changed
          - result is failed

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ status_fail }}"



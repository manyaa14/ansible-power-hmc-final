---
- name: Verify that when name is missing for present state
  block:
    - name: Error name is missed for present state
      hmc_user:
        state: present
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        attributes:
          resourcerole: "{{ resourcerole }}"
          authentication_type: "{{ authentication_type }}"
          passwd: "{{ passwd }}"
        taskrole: "{{ taskrole }}"
      register: result
      ignore_errors: yes

    - assert:
        that:
          - result is failed
          - result is not changed

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ status_fail }}"

- name: Configure Ldap Server
  block:
    - name: Configure Ldap Server
      hmc_user:
        action: configure_ldap
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        ldap_settings:
          primary: "{{ primary }}"
          binddn: "{{ binddn }}"
          basedn: "{{ basedn}}"
          bindpw: "{{ bindpw }}"
          automanage: "{{ automanage }}"
      register: result

    - name: Verify the result
      assert:
        that:
          - result is changed
          - result is success

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ status_fail }}"


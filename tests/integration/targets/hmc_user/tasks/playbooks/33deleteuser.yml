---
- name: Remove hmc user
  block:
    - name: Remove hmc user
      hmc_user:
        state: absent
        hmc_host: "{{ inventory_hostname }}"
        name: "{{ ldapusername }}"
        hmc_auth: "{{ curr_hmc_auth }}"
      register: result
      ignore_errors: yes

    - name: Output Users
      debug:
        msg: "{{ result }}"

    - assert:
        that:
          - result is success
          - result is changed

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ status_fail }}"

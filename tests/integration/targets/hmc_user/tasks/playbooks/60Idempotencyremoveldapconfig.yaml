- name: Remove Ldap Config Idempotency chnaged=0 should come when we try to remove already removed config
  block:
    - name: Remove Ldap Config Idempotency chnaged=0 should come when we try to remove already removed config
      hmc_user:
        action: remove_ldap_config
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        ldap_resource: searchfilter
      register: result

    - name: Veriy the Result
      assert:
        that:
          - result is not changed
          - result is success

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ status_fail }}"



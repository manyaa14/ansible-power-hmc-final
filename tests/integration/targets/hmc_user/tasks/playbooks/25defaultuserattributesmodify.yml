---
- name: Modify user attributes
  block:
    - name: Modify user attributes
      hmc_user:
        state: updated
        hmc_host: "{{ inventory_hostname }}"
        type: "{{ type_default }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        attributes:
          session_timeout: "{{ new_session_timeout }}"
          idle_timeout: "{{ new_idle_timeout }}"
          max_webui_login_attempts: "{{ new_max_webui_login_attempts }}"
#        webui_login_suspend_time: "{{ webui_login_suspend_time }}"
      register: result

    - assert:
        that:
          - result is success
          - result is changed

    - name: Modify user  HMC Management attributes( just to revert back & to avoid failures in next Iteration)
      hmc_user:
        state: updated
        hmc_host: "{{ inventory_hostname }}"
        type: "{{ type_default }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        attributes:
          session_timeout: "{{ session_timeout }}"
          idle_timeout: "{{ new_idle_timeout }}"
          max_webui_login_attempts: "{{ max_webui_login_attempts }}"
#        webui_login_suspend_time: "{{ webui_login_suspend_time }}"
      register: result

    - assert:
        that:
          - result is success
          - result is changed

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ status_fail }}"

      

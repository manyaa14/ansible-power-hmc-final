---
- name: Create hmc user
  block:
    - name: Create hmc user
      hmc_user:
        state: present
        hmc_host: "{{ inventory_hostname }}"
        name: "{{ item }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        attributes:
          authentication_type: "{{ authentication_type }}"
          passwd: "{{ passwd }}"
          taskrole: "{{ taskrole }}"
      loop: "{{ localusers }}"
      register: result

    - name: Output Users
      debug:
        msg: "{{ result }}"

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ status_fail }}"



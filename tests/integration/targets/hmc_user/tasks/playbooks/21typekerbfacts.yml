---
- name: Error with type as kerberos for facts state
  block:
    - name: Error with type as kerberos for facts state
      hmc_user:
        state: facts
        hmc_host: "{{ inventory_hostname }}"
        type: "{{ type_kerberos }}"
        hmc_auth: "{{ curr_hmc_auth }}"
      register: result
      ignore_errors: yes

    - name: Output Users
      debug:
        msg: "{{ result }}"

    - assert:
        that:
          - "'ParameterError: facts state will not support type: kerberos' in result.msg"
          - result is failed
          - result is not changed

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ status_fail }}"

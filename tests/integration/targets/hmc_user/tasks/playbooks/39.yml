---
- name: Create hmc user
  block:
    - name: Create hmc user
      hmc_user:
        state: absent
        hmc_host: "{{ inventory_hostname }}"
        type: "{{ type_all }}"
        hmc_auth: "{{ curr_hmc_auth }}"
      register: result

    - assert:
        that:
          - result is success
          - result is changed

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ status_fail }}"


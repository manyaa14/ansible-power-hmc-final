- name: COnfigure Ldap
  block:
    - name: COnfigure Ldap
      hmc_user:
        action: configure_ldap
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        ldap_settings:
          primary: "{{ primary }}"
          binddn: "{{ binddn }}"
          basedn: "{{ basedn }}"
          bindpw: "{{ bindpw }}"
          hmcgroups: "{{ hmcgroups }}"
          tlsreqcert: "{{ tlsreqcert }}"
          automanage: "{{ automanage_1 }}"
          groupattribute: "{{ groupattribute }}"
          memberattribute: "{{ memberattribute }}"
      register: result

    - name: Verify the result
      assert:
        that:
          - result is success
          - result is changed

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ status_fail }}"


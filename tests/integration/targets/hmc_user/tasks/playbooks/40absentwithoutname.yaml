---
- name: Create hmc user
  block:
    - name: Create hmc user
      hmc_user:
        state: absent
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
      register: result
      ignore_errors: yes

    - name: Verify the error message
      assert:
        that:
          - "'ParameterError: absent state need either name or type parameter' in result.msg"
          - result is not changed
          - result is failed

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ status_fail }}"



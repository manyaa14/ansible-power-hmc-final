---
- name: Modify user attributes
  block:
    - name: Modify user attributes
      hmc_user:
        state: updated
        hmc_host: "{{ inventory_hostname }}"
        name: "{{ kerberosusername }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        attributes:
          description: "{{ description }}"
      register: result

    - name: Output Users
      debug:
        msg: "{{ result }}"

    - assert:
        that:
          - result is success
          - result is changed

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ status_fail }}"


---
- name: Error when type mentioned in present state
  block:
    - name: Error when type mentioned in present state
      hmc_user:
        state: present
        hmc_host: "{{ inventory_hostname }}"
        name: "{{ name }}"
        type: "{{ type_all }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        attributes:
          resourcerole: "{{ resourcerole }}"
          authentication_type: "{{ authentication_type }}"
          passwd: "{{ passwd }}"
          taskrole: "{{ taskrole }}"
      register: result
      ignore_errors: yes

    - assert:
        that:
          - "'ParameterError: unsupported parameter: type' in result.msg"
          - result is failed
          - result is not changed

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ status_fail }}"

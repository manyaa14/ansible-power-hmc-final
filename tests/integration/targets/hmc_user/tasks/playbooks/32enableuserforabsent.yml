---
- name: Error enable_user for absent state
  block:
    - name: Error enable_user for absent state
      hmc_user:
        state: absent
        hmc_host: "{{ inventory_hostname }}"
        name: "{{ new_name }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        enable_user: "{{ enable_user_true }}"
      register: result
      ignore_errors: yes

    - name: Output Users
      debug:
        msg: "{{ result }}"

    - assert:
        that:
          - "'ParameterError: unsupported parameter: enable_user' in result.msg"
          - result is failed
          - result is not changed

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ status_fail }}"

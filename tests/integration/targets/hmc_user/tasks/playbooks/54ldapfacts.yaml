- name: Run adhoc command on HMC
  block:
    - name: Run adhoc command on HMC
      hmc_command:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        cmd: "{{ item }}"
      register: result
      loop: "{{ ldap_commands }}"


    - name: Stdout the command output
      debug:
        msg: '{{ result }}'

    - name: Verify the result
      assert:
        that:
          - result is changed

    - name: Retrieve ldapconfig
      hmc_user:
        state: ldap_facts
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        resource: "{{ resource_user }}"
      register: result

    - name: Verify the Result
      assert:
        that:
          - result is not changed
          - result is success

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ status_fail }}"



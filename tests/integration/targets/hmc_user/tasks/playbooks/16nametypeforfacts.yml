---
- name: Create hmc user
  block:
    - name: Create hmc user
      hmc_user:
        state: facts
        hmc_host: "{{ inventory_hostname }}"
        type: "{{ type_all }}"
        name: "{{ name }}"
        hmc_auth: "{{ curr_hmc_auth }}"
      register: result
      ignore_errors: yes

    - name: Output Users
      debug:
        msg: "{{ result }}"

    - assert:
        that:
          - result is failed
          - result is not changed

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ status_fail }}"

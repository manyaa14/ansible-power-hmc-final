---
- name: Create hmc user
  block:
    - name: Create hmc user
      hmc_user:
        state: present
        hmc_host: "{{ inventory_hostname }}"
        name: "{{ item }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        attributes:
          resourcerole: "{{ resourcerole }}"
          authentication_type: "{{ authentication_type }}"
          passwd: "{{ passwd }}"
          taskrole: "{{ taskrole }}"
      loop: "{{ localusers }}"
      register: result

    - name: Output Users
      debug:
        msg: "{{ result }}"

    - assert:
        that:
          - result is success
          - result is changed
  
    - name: Create hmc user
      hmc_user:
        state: present
        hmc_host: "{{ inventory_hostname }}"
        name: "{{ item }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        attributes:
          resourcerole: "{{ resourcerole }}"
          authentication_type: "{{ authentication_type_kerberos }}"
          remote_user_name: "{{ remote_user_name }}"
          taskrole: "{{ taskrole }}"
      loop: "{{ kerberosusers }}"
      register: result

    - name: Output Users
      debug:
        msg: "{{ result }}"

    - assert:
        that:
          - result is success
          - result is changed

    - name: Create hmc user
      hmc_user:
        state: present
        hmc_host: "{{ inventory_hostname }}"
        name: "{{ item }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        attributes:
          resourcerole: "{{ resourcerole }}"
          authentication_type: "{{ authentication_type_ldap }}"
          taskrole: "{{ taskrole }}"
      loop: "{{ ldapusers }}"
      register: result

    - name: Output Users
      debug:
        msg: "{{ result }}"

    - assert:
        that:
          - result is success
          - result is changed

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ status_fail }}"


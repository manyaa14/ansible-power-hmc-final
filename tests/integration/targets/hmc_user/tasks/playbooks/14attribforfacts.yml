---
- name: Error when attributes mentioned for facts
  block:
    - name: Error when attributes mentioned for facts
      hmc_user:
        state: facts
        hmc_host: "{{ inventory_hostname }}"
        name: "{{ name }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        attributes:
          taskrole: "{{ taskrole }}"
      register: result
      ignore_errors: yes

    - name: Output Users
      debug:
        msg: "{{ result }}"

    - assert:
        that:
          - "'ParameterError: unsupported parameter: attributes' in result.msg"
          - result is failed
          - result is not changed

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ status_fail }}"

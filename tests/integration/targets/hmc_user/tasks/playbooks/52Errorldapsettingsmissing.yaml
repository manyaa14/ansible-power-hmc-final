- name: reports error when ldap_settings is missing
  block:
    - name: reports error when ldap_settings is missing
      hmc_user:
        action: configure_ldap
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
      register: result
      ignore_errors: yes

    - name: Verify the result
      assert:
        that:
          - result is not changed
          - result is failed

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ status_fail }}"


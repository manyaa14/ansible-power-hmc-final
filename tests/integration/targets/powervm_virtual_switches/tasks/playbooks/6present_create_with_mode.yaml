- name: Verify virtual switch creation with explicit mode
  block:
    - name: Create virtual switch with Vepa mode
      powervm_virtual_switches:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        virtual_switch_name: "{{ switch_name_create_mode }}"
        virtual_switch_mode: "{{ switch_mode_vepa }}"
        state: present
      register: testout

    - name: Stdout the create response
      debug:
        msg: '{{ testout }}'

    - name: Verify virtual switch is created with explicit mode
      assert:
        that:
          - testout is success
          - testout is changed
          - "'created successfully' in testout.msg"

    - name: Verify created switch facts
      powervm_virtual_switches:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        virtual_switch_name: "{{ switch_name_create_mode }}"
        state: facts
      register: facts_out

    - name: Verify mode is Vepa
      assert:
        that:
          - facts_out is success
          - facts_out.virtual_switch_info.virtual_switches | length == 1
          - facts_out.virtual_switch_info.virtual_switches[0].switch_mode == switch_mode_vepa

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"


- name: Verify facts for a missing virtual switch
  block:
    - name: Ensure missing switch is absent before facts lookup
      powervm_virtual_switches:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        virtual_switch_name: "{{ switch_name_facts_missing }}"
        state: absent
      register: absent_out

    - name: Get facts for a missing virtual switch
      powervm_virtual_switches:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        virtual_switch_name: "{{ switch_name_facts_missing }}"
        state: facts
      register: testout

    - name: Stdout the missing virtual switch facts
      debug:
        msg: '{{ testout }}'

    - name: Verify facts report missing switch without failure
      assert:
        that:
          - testout is success
          - testout is not changed
          - testout.virtual_switch_info.virtual_switches | length == 0
          - "'not found in system' in testout.virtual_switch_info.msg"

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"


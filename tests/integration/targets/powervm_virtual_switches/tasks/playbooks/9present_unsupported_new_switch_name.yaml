- name: Verify create rejects unsupported new switch name
  block:
    - name: Create virtual switch with unsupported new_switch_name
      powervm_virtual_switches:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        virtual_switch_name: "{{ switch_name_create_default }}"
        new_switch_name: "{{ switch_name_modify_target }}"
        state: present
      register: testout
      ignore_errors: true

    - name: Stdout the unsupported new_switch_name response
      debug:
        msg: '{{ testout }}'

    - name: Verify unsupported new_switch_name error is reported
      assert:
        that:
          - testout is failed
          - testout is not changed
          - "'unsupported parameter: new_switch_name' in testout.msg"

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"


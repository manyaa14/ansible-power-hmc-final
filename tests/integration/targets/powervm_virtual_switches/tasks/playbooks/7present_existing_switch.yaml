- name: Verify create reports already-existing virtual switch
  block:
    - name: Ensure duplicate-test switch exists
      powervm_virtual_switches:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        virtual_switch_name: "{{ switch_name_create_duplicate }}"
        state: present
      register: setup_out

    - name: Re-run create for an existing virtual switch
      powervm_virtual_switches:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        virtual_switch_name: "{{ switch_name_create_duplicate }}"
        state: present
      register: testout

    - name: Stdout the duplicate create response
      debug:
        msg: '{{ testout }}'

    - name: Verify existing switch is reported without change
      assert:
        that:
          - testout is success
          - testout is not changed
          - "'already exists' in testout.msg"

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"


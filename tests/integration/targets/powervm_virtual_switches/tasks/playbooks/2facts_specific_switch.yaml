- name: Verify facts for a specific existing virtual switch
  block:
    - name: Ensure facts switch exists
      powervm_virtual_switches:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        virtual_switch_name: "{{ switch_name_facts_existing }}"
        state: present
      register: create_out

    - name: Get facts for a specific virtual switch
      powervm_virtual_switches:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        virtual_switch_name: "{{ switch_name_facts_existing }}"
        state: facts
      register: testout

    - name: Stdout the virtual switch facts
      debug:
        msg: '{{ testout }}'

    - name: Verify facts for the requested virtual switch are returned
      assert:
        that:
          - testout is success
          - testout is not changed
          - testout.virtual_switch_info.virtual_switches | length == 1
          - testout.virtual_switch_info.virtual_switches[0].switch_name == switch_name_facts_existing

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"


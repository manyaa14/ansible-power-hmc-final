- name: Verify modify requires at least one change parameter
  block:
    - name: Ensure switch exists before empty modify test
      powervm_virtual_switches:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        virtual_switch_name: "{{ switch_name_modify_source }}"
        state: present
      register: setup_out

    - name: Modify virtual switch without mode or new name
      powervm_virtual_switches:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        virtual_switch_name: "{{ switch_name_modify_source }}"
        state: modify
      register: testout
      ignore_errors: true

    - name: Stdout the empty modify response
      debug:
        msg: '{{ testout }}'

    - name: Verify modify parameter validation error is reported
      assert:
        that:
          - testout is failed
          - testout is not changed
          - "'at least one of' in testout.msg"
          - "'virtual_switch_mode' in testout.msg"
          - "'new_switch_name' in testout.msg"

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"


- name: Verify create fails when virtual_network_name is missing for state=present
  block:
    - name: Create CNA with state=present but no virtual_network_name
      powervm_client_network_adapter:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name }}"
        state: present
      register: testout
      ignore_errors: true

    - name: Verify missing virtual_network_name error is reported
      assert:
        that:
          - testout is failed

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"

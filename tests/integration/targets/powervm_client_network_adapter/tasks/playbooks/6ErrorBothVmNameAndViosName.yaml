- name: Verify create fails when both vm_name and vios_name are provided
  block:
    - name: Create CNA with both vm_name and vios_name (mutually exclusive)
      powervm_client_network_adapter:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name }}"
        vios_name: "{{ vios_name }}"
        virtual_network_name: "{{ virtual_network_name }}"
        state: present
      register: testout
      ignore_errors: true

    - name: Verify mutually exclusive vm_name/vios_name error is reported
      assert:
        that:
          - testout is failed

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"

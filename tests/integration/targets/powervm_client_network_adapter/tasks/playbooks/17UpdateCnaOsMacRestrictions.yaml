- name: Update CNA OS MAC address restrictions
  block:
    - name: Update CNA os_mac_address_restrictions using state=updated
      powervm_client_network_adapter:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name }}"
        virtual_ethernet_adapter_id: "{{ virtual_ethernet_adapter_id_create }}"
        os_mac_address_restrictions: "{{ os_mac_address_restrictions }}"
        state: updated
      register: testout

    - name: Debug update OS MAC restrictions output
      debug:
        msg: '{{ testout }}'

    - name: Verify CNA OS MAC restrictions are updated
      assert:
        that:
          - testout is changed
          - testout is success

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"

- name: Verify create fails when both vm_name and vios_name are missing
  block:
    - name: Create CNA without vm_name or vios_name
      powervm_client_network_adapter:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        virtual_network_name: "{{ virtual_network_name }}"
        state: present
      register: testout
      ignore_errors: true

    - name: Verify missing vm_name/vios_name error is reported
      assert:
        that:
          - testout is failed

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"

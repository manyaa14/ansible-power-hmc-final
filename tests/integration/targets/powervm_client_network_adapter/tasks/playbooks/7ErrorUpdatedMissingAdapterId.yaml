- name: Verify update fails when virtual_ethernet_adapter_id is missing for state=updated
  block:
    - name: Update CNA with state=updated but no virtual_ethernet_adapter_id
      powervm_client_network_adapter:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name }}"
        mac_address: "{{ mac_address }}"
        state: updated
      register: testout
      ignore_errors: true

    - name: Verify missing virtual_ethernet_adapter_id error is reported
      assert:
        that:
          - testout is failed

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"

- name: Create CNA on LPAR attached to a virtual network
  block:
    - name: Create CNA on LPAR
      powervm_client_network_adapter:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name }}"
        virtual_network_name: "{{ virtual_network_name }}"
        state: present
      register: testout

    - name: Debug create CNA output
      debug:
        msg: '{{ testout }}'

    - name: Verify CNA is created
      assert:
        that:
          - testout is changed
          - testout is success

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"

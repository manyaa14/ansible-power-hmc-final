- name: Get all CNA facts for LPAR
  block:
    - name: Get all CNA facts on the LPAR
      powervm_client_network_adapter:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name }}"
        state: facts
      register: testout

    - name: Debug CNA facts output
      debug:
        msg: '{{ testout }}'

    - name: Verify CNA facts are returned
      assert:
        that:
          - testout is success
          - testout is not changed

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"

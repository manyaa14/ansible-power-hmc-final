- name: Create CNA on LPAR with an explicit virtual slot number
  block:
    - name: Create CNA with specified virtual_ethernet_adapter_id
      powervm_client_network_adapter:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name }}"
        virtual_network_name: "{{ virtual_network_name }}"
        virtual_ethernet_adapter_id: "{{ virtual_ethernet_adapter_id_create }}"
        state: present
      register: testout

    - name: Debug create with slot number output
      debug:
        msg: '{{ testout }}'

    - name: Verify CNA is created with specified slot
      assert:
        that:
          - testout is changed
          - testout is success

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"

- name: Verify create fails when system_name is missing
  block:
    - name: Create CNA without system_name
      powervm_client_network_adapter:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        vm_name: "{{ vm_name }}"
        virtual_network_name: "{{ virtual_network_name }}"
        state: present
      register: testout
      ignore_errors: true

    - name: Verify missing system_name error is reported
      assert:
        that:
          - testout is failed

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"

- name: Verify create fails when hmc_host is missing
  block:
    - name: Create CNA without hmc_host
      powervm_client_network_adapter:
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name }}"
        virtual_network_name: "{{ virtual_network_name }}"
        state: present
      register: testout
      ignore_errors: true

    - name: Verify missing hmc_host error is reported
      assert:
        that:
          - testout is failed

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"

- name: Update CNA QoS settings
  block:
    - name: Update CNA QoS priority using state=updated
      powervm_client_network_adapter:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name }}"
        virtual_ethernet_adapter_id: "{{ virtual_ethernet_adapter_id_create }}"
        qos_priority_enabled: "{{ qos_priority_enabled }}"
        qos_priority: "{{ qos_priority }}"
        state: updated
      register: testout

    - name: Debug update QoS settings output
      debug:
        msg: '{{ testout }}'

    - name: Verify CNA QoS settings are updated
      assert:
        that:
          - testout is changed
          - testout is success

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"

- name: Update CNA MAC address
  block:
    - name: Update CNA MAC address using state=updated
      powervm_client_network_adapter:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name }}"
        virtual_ethernet_adapter_id: "{{ virtual_ethernet_adapter_id_create }}"
        mac_address: "{{ mac_address }}"
        state: updated
      register: testout

    - name: Debug update MAC address output
      debug:
        msg: '{{ testout }}'

    - name: Verify CNA MAC address is updated
      assert:
        that:
          - testout is changed
          - testout is success

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"

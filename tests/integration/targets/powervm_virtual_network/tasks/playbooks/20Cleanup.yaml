- name: Cleanup all virtual networks created during test run
  block:
    - name: Delete network_name_create_tagged if it exists
      powervm_virtual_network:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        network_name: "{{ network_name_create_tagged }}"
        state: absent
      register: testout_tagged
      ignore_errors: true

    - name: Delete network_name_create_switchid if it exists
      powervm_virtual_network:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        network_name: "{{ network_name_create_switchid }}"
        state: absent
      register: testout_switchid
      ignore_errors: true

    - name: Delete network_name_create if it still exists
      powervm_virtual_network:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        network_name: "{{ network_name_create }}"
        state: absent
      register: testout_create
      ignore_errors: true

    - name: Stdout cleanup results
      debug:
        msg: "Cleanup complete"

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"

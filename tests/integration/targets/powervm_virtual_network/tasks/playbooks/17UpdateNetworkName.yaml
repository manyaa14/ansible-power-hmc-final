- name: Update virtual network name
  block:
    - name: Update the name of an existing virtual network
      powervm_virtual_network:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        network_name: "{{ network_name_create }}"
        new_network_name: "{{ new_network_name }}"
        state: updated
      register: testout

    - name: Stdout the update response
      debug:
        msg: '{{ testout }}'

    - name: Verify virtual network name is updated
      assert:
        that:
          - testout is changed
          - testout is success

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"

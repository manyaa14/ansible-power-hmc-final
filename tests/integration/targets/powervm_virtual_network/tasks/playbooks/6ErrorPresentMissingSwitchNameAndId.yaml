- name: Verify create fails when both switch_name and switch_id are missing
  block:
    - name: Create virtual network without switch_name or switch_id
      powervm_virtual_network:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        network_name: "{{ network_name_create }}"
        network_vlan_id: "{{ network_vlan_id }}"
        state: present
      register: testout
      ignore_errors: true

    - name: Verify missing switch error is reported
      assert:
        that:
          - testout is failed

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"

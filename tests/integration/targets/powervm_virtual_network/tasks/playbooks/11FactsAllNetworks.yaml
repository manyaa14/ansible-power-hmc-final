- name: Get all virtual network facts
  block:
    - name: Get all virtual network facts
      powervm_virtual_network:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        state: facts
      register: testout

    - name: Stdout the virtual network facts
      debug:
        msg: '{{ testout }}'

    - name: Verify all virtual network facts are returned
      assert:
        that:
          - testout is success
          - testout is not changed

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"

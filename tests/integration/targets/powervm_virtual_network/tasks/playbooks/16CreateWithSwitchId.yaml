- name: Create virtual network using switch_id
  block:
    - name: Create virtual network with switch_id
      powervm_virtual_network:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        network_name: "{{ network_name_create_switchid }}"
        network_vlan_id: "{{ network_vlan_id_switchid }}"
        switch_id: "{{ switch_id }}"
        tagged_network: "{{ tagged_network }}"
        state: present
      register: testout

    - name: Stdout the create with switch_id response
      debug:
        msg: '{{ testout }}'

    - name: Verify virtual network is created with switch_id
      assert:
        that:
          - testout is changed
          - testout is success

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"

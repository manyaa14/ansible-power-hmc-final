- name: Verify create fails when network_vlan_id is missing
  block:
    - name: Create virtual network without network_vlan_id
      powervm_virtual_network:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        network_name: "{{ network_name_create }}"
        switch_name: "{{ switch_name }}"
        state: present
      register: testout
      ignore_errors: true

    - name: Verify missing network_vlan_id error is reported
      assert:
        that:
          - testout is failed

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"

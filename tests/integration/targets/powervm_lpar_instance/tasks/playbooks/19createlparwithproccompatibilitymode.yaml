- name: create lpar with weight,proc_mode
  block:
    - name: create lpar with weight,proc_mode
      powervm_lpar_instance:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ item.vm_name  }}"
        os_type: "{{ item.os_type }}"
        proc_mode: "{{ proc_mode_uncapped }}"
        weight: "{{ weight }}"   
        proc: "{{ proc }}"
        min_proc: "{{ min_proc }}"
        max_proc: "{{ max_proc }}"
        proc_unit: "{{ proc_unit }}"
        max_proc_unit: "{{ max_proc_unit }}"
        min_proc_unit: "{{ min_proc_unit }}"
        proc_compatibility_mode: "{{ proc_compatibility_mode }}"
        state: "{{ state_present }}"
      register: result
      loop: "{{ lpars | rejectattr('os_type', 'equalto', os_type_ibmi) | list }}"

    - name: Stdout the created logical partition
      debug:
        msg: '{{ result }}'

    - assert:
        that:
          - result is success
          - result is changed

    - name: Delete logical partition
      powervm_lpar_instance:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ item.vm_name }}"
        state: "{{ state_absent }}"
      register: testout
      loop: "{{ lpars | rejectattr('os_type', 'equalto', os_type_ibmi) | list }}"

    - name: Stdout the probed info
      debug:
        msg: '{{ testout }}'

    - assert:
        that:
          - testout is success
          - testout is changed

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"



- name: 29createlparwithphysicalio - create lpar when we provide maxmem,minmem,mem,minmaxproc,minmax proc_unit
  block:
    - name: 29createlparwithphysicalio - create lpar when we provide maxmem,minmem,mem,minmaxproc,minmax proc_unit
      powervm_lpar_instance:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ item.vm_name  }}"
        os_type: "{{ item.os_type }}"
        mem: "{{ mem }}"
        max_mem: "{{ max_mem }}"
        min_mem: "{{ min_mem }}"
        proc: "{{ proc }}"
        min_proc: "{{ min_proc }}"
        max_proc: "{{ max_proc }}"
        proc_unit: "{{ proc_unit }}"
        max_proc_unit: "{{ max_proc_unit }}"
        min_proc_unit: "{{ min_proc_unit }}"
        state: "{{ state_present }}"
        physical_io: "{{ physical_io }}"
      register: result
      loop: "{{ lpars}}"

    - name: Stdout the created logical partition
      debug:
        msg: '{{ result }}'

    - assert:
        that:
          - result is success
          - result is changed

    - name: Delete logical partition
      powervm_lpar_instance:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ item.vm_name }}"
        state: "{{ state_absent }}"
      register: testout
      loop: "{{ lpars }}"

    - name: Stdout the probed info
      debug:
        msg: '{{ testout }}'

    - name: Verify that lpar gets created lpar successfully
      assert:
        that:
          - testout is success
          - testout is changed

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"



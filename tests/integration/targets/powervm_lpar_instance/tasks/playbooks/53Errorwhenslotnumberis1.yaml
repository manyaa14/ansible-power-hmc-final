- name: Error-when slot number is one
  block:
    - name: Error-when slot number is one
      powervm_lpar_instance:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name  }}"
        os_type: "{{ os_type_linux }}"    
        virt_network_config:
          - network_name: "{{ network_name }}"
            slot_number: 1
        state: "{{ state_present }}"
      register: result
      ignore_errors: yes

    - name: Verify that play reports error
      assert:
        that:
          - result is failed
          - result is not changed

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"

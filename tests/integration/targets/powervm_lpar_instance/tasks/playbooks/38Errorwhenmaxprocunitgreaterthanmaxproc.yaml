- name: Error-when proc_unit greater than proc
  block:
    - name: Error-when proc_unit greater than proc
      powervm_lpar_instance:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name  }}"
        os_type: "{{ os_type_aix }}"
        mem: "{{ mem }}"
        max_mem: "{{ max_mem }}"
        min_mem: "{{ min_mem }}"
        proc: "{{ proc }}"
        min_proc: "{{ min_proc }}"
        max_proc: "{{ max_proc_unit }}"
        proc_unit: "{{ proc_unit }}"
        max_proc_unit: "{{ max_proc }}"
        min_proc_unit: "{{ min_proc_unit }}"
        state: "{{ state_present }}"
      register: result
      ignore_errors: yes

    - name: Verify that play throws error
      assert:
        that:
          - "'Maximum number of processing unit exceeds maximum number of virtual processor for the partition' in result.msg"
          - result is failed
          - result is not changed

  
  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"




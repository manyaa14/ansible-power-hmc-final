- name: Error-when min-mem mentioned without mem
  block:
    - name: Error-when min-mem mentioned without mem
      powervm_lpar_instance:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name  }}"
        os_type: "{{ os_type_aix }}"
        min_mem: "{{ min_mem }}"
        state: "{{ state_present }}"
      register: result
      ignore_errors: yes

    - name: Verify the error message
      assert:
        that:
          - '"{{ error23 }}" in result.msg'
          - result is failed
          - result is not changed

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"



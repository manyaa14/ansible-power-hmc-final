- name: Error-when min_proc_unit mentioned without proc_unit
  block:
    - name: Error-when min_proc_unit mentioned without proc_unit
      powervm_lpar_instance:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name  }}"
        os_type: "{{ os_type_aix }}"
        min_proc: "{{ min_proc }}"
        max_proc: "{{ max_proc }}"
        state: "{{ state_present }}"
      register: result
      ignore_errors: yes

    - name: Verify the error
      assert:
        that:
          - result is failed
          - result is not changed
          - '"{{ error27 }}" in result.msg'

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"

 

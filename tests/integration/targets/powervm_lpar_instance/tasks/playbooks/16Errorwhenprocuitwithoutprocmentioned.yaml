- name: create lpar when we provide proc_unit without proc is specified
  block:
    - name: create lpar when we provide proc_unit without proc is specified
      powervm_lpar_instance:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name  }}"
        os_type: "{{ os_type_ibmi }}"
        proc_unit: "{{ proc_unit }}"
        min_proc_unit: "{{ min_proc_unit }}"
        state: "{{ state_present }}"
      register: result
      ignore_errors: yes

    - name: Stdout the created logical partition
      debug:
        msg: '{{ result }}'

    - assert:
        that:
          - result is failed
          - result is not changed
          - '"{{ error }}" in result.msg'

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"

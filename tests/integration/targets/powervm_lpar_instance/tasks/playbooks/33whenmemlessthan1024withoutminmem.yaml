- name: Verify that play throws error when min_mem is not mentioned & mem<1024(1 MB)
  block:
    - name: Verify that play throws error when min_mem is not mentioned & mem<1024(1 MB)
      powervm_lpar_instance:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name  }}"
        os_type: "{{ os_type_linux }}"
        mem: 512
        state: "{{ state_present }}"
      register: result
      ignore_errors: yes

    - name: Verify that play reports error
      assert:
        that:
          - result.failed | default(false)
          - not (result.changed | default(false))
          - '"Allocated memory:512 value should be in-between minimum memory:1024 and  maximum memory:512" in (result.msg | default(""))'

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"

- name: Create lpar with max virtual slots
  block:
    - name: Create lpar with max virtual slots
      powervm_lpar_instance:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ item.vm_name  }}"
        max_virtual_slots: "{{ max_virtual_slots }}"
        os_type: "{{ item.os_type }}"
        state: present
      register: result
      loop: "{{ lpars }}"

    - name: Stdout the created logical partition
      debug:
        msg: '{{ result }}'

    - assert:
        that:
          - result is success
          - result is changed

    - name: Delete logical partition
      powervm_lpar_instance:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ item.vm_name }}"
        state: "{{ state_absent }}"
      register: testout
      loop: "{{ lpars }}"

    - name: Stdout the probed info
      debug:
        msg: '{{ testout }}'

    - assert:
        that:
          - testout is success
          - testout is changed

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "FAILED TO CREATE OR DELETE THE LOGICAL PARTITION"

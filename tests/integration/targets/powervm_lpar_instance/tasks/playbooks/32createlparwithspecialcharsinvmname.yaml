- name: 32create lpar when we provide specialcharectors in name
  block:
    - name: 32create lpar when we provide specialcharectors in name
      powervm_lpar_instance:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name + '@#' }}"
        os_type: "{{ os_type_aix }}"
        state: "{{ state_present }}"
      register: result

    - name: Stdout the created logical partition
      debug:
        msg: '{{ result }}'

    - assert:
        that:
          - result is success
          - result is changed
          # - "'{{ vm_name + '@#' }}' in '{{ result['partition_info']['PartitionName'] }}'"
          - result.partition_info.PartitionName == (vm_name + '@#')

    - name: Delete logical partition
      powervm_lpar_instance:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name + '@#' }}"
        state: "{{ state_absent }}"
      register: testout

    - name: Stdout the probed info
      debug:
        msg: '{{ testout }}'

    - name: Verify that lpar gets created lpar successfully
      assert:
        that:
          - testout is success
          - testout is changed

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"



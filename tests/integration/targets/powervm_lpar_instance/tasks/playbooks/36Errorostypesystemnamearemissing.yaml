- name: Verify that play throws error when system_name & os_type are missing
  block:
    - name: Verify that play throws error when system_name & os_type are missing
      powervm_lpar_instance:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        vm_name: "{{ vm_name }}"
        mem: 512
        state: "{{ state_present }}"
      register: result
      ignore_errors: yes

    - name: Verify that play reports error
      assert:
        that:
          - '"state is present but all of the following are missing: system_name, os_type" in result.msg'
          - result is failed
          - result is not changed

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"

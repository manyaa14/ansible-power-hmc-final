- name: create lpar when we provide only proc_unit,min_proc_unit
  block:
    - name: create lpar when we provide only proc_unit,min_proc_unit
      powervm_lpar_instance:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name  }}"
        os_type: "{{ os_type_ibmi }}"
        proc: "{{ proc }}"
        min_proc: "{{ min_proc }}"
        proc_unit: "{{ proc_unit }}"
        min_proc_unit: "{{ min_proc_unit }}"
        state: "{{ state_present }}"
      register: result

    - name: Stdout the created logical partition
      debug:
        msg: '{{ result }}'

    - assert:
        that:
          - result is success
          - result is changed

    - name: Delete logical partition
      powervm_lpar_instance:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name }}"
        state: "{{ state_absent }}"
      register: testout

    - name: Stdout the probed info
      debug:
        msg: '{{ testout }}'

    - assert:
        that:
          - testout is success
          - testout is changed

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"



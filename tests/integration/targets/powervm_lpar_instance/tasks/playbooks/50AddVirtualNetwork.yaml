- name: Create an Lpar with Virtual_network
  block:
    - name: Create an Lpar with Virtual_network
      powervm_lpar_instance:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ item.vm_name  }}"
        os_type: "{{ item.os_type }}"    
        max_virtual_slots: "{{ max_virtual_slots }}"
        virt_network_config:
          - network_name: "{{ network_name }}"
            slot_number: "{{ slot_number }}"
        state: "{{ state_present }}"
      register: result
      loop: "{{ lpars }}"

    - name: Stdout the created Lpar details
      debug:
        msg: "{{ result }}"

    - name: Verify Lpar gets created successfully
      assert:
        that:
          - result is success
          - result is changed

    - name: Delete logical partition
      powervm_lpar_instance:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ item.vm_name }}"
        state: "{{ state_absent }}"
      register: testout
      loop: "{{ lpars }}"

    - name: Stdout the probed info
      debug:
        msg: '{{ testout }}'

    - assert:
        that:
          - testout is success
          - testout is changed

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"

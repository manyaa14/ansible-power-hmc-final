- name: Create an Lpar with  multiple Virtual_networks
  block:
    - name: Create an Lpar with  multiple Virtual_networks
      powervm_lpar_instance:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name  }}"
        os_type: "{{ os_type_linux }}"    
        virt_network_config:
          - network_name: "{{ network_name }}"
            slot_number: "{{ slot_number }}"
          - network_name: "{{ network_name2 }}"
        state: "{{ state_present }}"
      register: result

    - name: Stdout the created Lpar details
      debug:
        msg: "{{ result }}"

    - name: Verify Lpar gets created successfully
      assert:
        that:
          - result is success
          - result is changed

    - name: Delete logical partition
      powervm_lpar_instance:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name }}"
        state: "{{ state_absent }}"
      register: testout

    - name: Stdout the probed info
      debug:
        msg: '{{ testout }}'

    - assert:
        that:
          - testout is success
          - testout is changed

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"

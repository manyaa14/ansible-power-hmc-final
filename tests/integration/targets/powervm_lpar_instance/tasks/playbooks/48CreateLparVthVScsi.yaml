- name: Error-when we miss ; in wwpn_pair
  block:
    - name: Error-when we miss ; in wwpn_pair
      powervm_lpar_instance:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name + 'NPIV1' }}"
        os_type: "{{ os_type_aix }}"
        max_virtual_slots: "{{ max_virtual_slots }}"
        volume_config:
          volume_size: "{{ volume_size }}" 
        state: "{{ state_present }}"
      register: result
      ignore_errors: yes

    - name: Stdout the error details
      debug:
        msg: "{{ result }}"

    - name: Verify the error
      assert:
        that:
          - result is failed
          - result is not changed
          - '"Error: WWPN pair with semicolon delimiter is expected" in result.msg'

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"

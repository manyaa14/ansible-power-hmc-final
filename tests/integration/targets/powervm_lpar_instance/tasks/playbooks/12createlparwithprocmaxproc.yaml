- name: create lpar when we provide only proc,max_proc
  block:
    - name: create lpar when we provide only proc,max_proc
      powervm_lpar_instance:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name  }}"
        os_type: "{{ os_type_aix }}"
        proc: "{{ proc }}"
        max_proc: "{{ max_proc }}"
        state: "{{ state_present }}"
      register: result

    - name: Stdout the created logical partition
      debug:
        msg: '{{ result }}'

    - name: Verify module returns partition details
      assert:
        that:
          - result is success
          - result.partition_info is defined
          - result.partition_info.SystemName == system_name

    - name: Delete logical partition
      powervm_lpar_instance:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name }}"
        state: "{{ state_absent }}"
      register: testout

    - name: Stdout the probed info
      debug:
        msg: '{{ testout }}'

    - assert:
        that:
          - testout is success
          - testout is changed

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"



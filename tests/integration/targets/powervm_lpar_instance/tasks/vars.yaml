---
plb_dir: targets/powervm_lpar_instance/tasks/playbooks
task_dir: targets/powervm_lpar_instance/tasks
selected_test_platform: asterix

Status_Fail: "TestCase Failed"

# States
os_type_aix: "aix"
os_type_linux: "linux"
os_type_aix_linux: "aix_linux"
os_type_ibmi: "ibmi"

lpars:
  - { os_type: 'linux', vm_name: 'Ansible_linuxlpar' }
  - { os_type: 'aix_linux', vm_name: 'Ansible_aixlinuxlpar' }
  - { os_type: 'ibmi', vm_name: 'Ansible_ibmilpar' }

# Below Variables are used for vm_id
system_name: "HV4"
vm_name: "Ansible_vmid-new"
vm_id: 110
max_virtual_slots: 100
proc_mode_capped: capped
proc_mode_uncapped: uncapped
weight: 230
proc_compatibility_mode: POWER11
proc_compatibility_mode_default: Default
proc: 3
max_proc: 5
min_proc: 2

proc_unit: 2
min_proc_unit: 1
max_proc_unit: 4

state_present: "present"
state_absent: "absent"

mem: 512
max_mem: 2048
min_mem: 256

physical_io:
  - U5792.001.CEC1203-P04-C049

physical_ios:
  - U5792.001.CEC1203-P04-C049
  - U5792.001.CEC1203-P07-C074

vios_name: "b76-vios2"
vios_name2: "b76-vios1"

# error messages
error: "missing parameter(s) required by 'proc_unit': proc"
error1: "missing parameter(s) required by 'max_mem': mem"
error23: "missing parameter(s) required by 'min_mem': mem"
error24: "missing parameter(s) required by 'min_proc': proc"
error25: "missing parameter(s) required by 'max_proc_unit': proc_unit"
error26: "missing parameter(s) required by 'min_proc_unit': proc_unit"
error27: "missing parameter(s) required by 'max_proc': proc"

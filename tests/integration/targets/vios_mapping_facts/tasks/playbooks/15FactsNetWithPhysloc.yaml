---
- name: "TC15 - Facts: net with physloc filter"
  block:
    - name: Run vios_mapping_facts with component net and physloc
      vios_mapping_facts:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vios_name: "{{ vios_name }}"
        component: net
        physloc: "{{ physloc_net_valid }}"
        state: facts
      register: result

    - name: Verify task succeeded and physloc-filtered net mapping returned
      assert:
        that:
          - result is success
          - result is not changed
          - result.mapping_facts is defined or result.warning is defined
        fail_msg: "{{ Status_Fail }}"
  rescue:
    - name: Testcase failed
      debug:
        msg: "{{ Status_Fail }}"

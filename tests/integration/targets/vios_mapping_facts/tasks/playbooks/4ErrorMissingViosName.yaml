---
- name: "TC4 - Error: missing vios_name"
  block:
    - name: Run vios_mapping_facts without vios_name
      vios_mapping_facts:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        state: facts
      register: result
      ignore_errors: true

    - name: Verify task failed with missing vios_name error
      assert:
        that:
          - result is failed
          - result is not changed
          - "'vios_name' in result.msg"
        fail_msg: "{{ Status_Fail }}"
  rescue:
    - name: Testcase failed
      debug:
        msg: "{{ Status_Fail }}"

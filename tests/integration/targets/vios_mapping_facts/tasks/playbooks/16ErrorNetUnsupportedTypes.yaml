---
- name: "TC16 - Error: net with unsupported types parameter"
  block:
    - name: Run vios_mapping_facts with component net and types (unsupported)
      vios_mapping_facts:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vios_name: "{{ vios_name }}"
        component: net
        types:
          - disk
        state: facts
      register: result
      ignore_errors: true

    - name: Verify task failed with unsupported types parameter error
      assert:
        that:
          - result is failed
          - result is not changed
          - "'types' in result.msg"
        fail_msg: "{{ Status_Fail }}"
  rescue:
    - name: Testcase failed
      debug:
        msg: "{{ Status_Fail }}"

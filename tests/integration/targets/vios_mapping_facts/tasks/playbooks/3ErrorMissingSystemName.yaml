---
- name: "TC3 - Error: missing system_name (auto-identify attempted)"
  block:
    - name: Run vios_mapping_facts without system_name
      vios_mapping_facts:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        vios_name: "{{ vios_name }}"
        state: facts
      register: result
      ignore_errors: true

    - name: Verify task ran (system_name is optional - auto-identified from vios_name)
      assert:
        that:
          - result is not changed
        fail_msg: "{{ Status_Fail }}"
  rescue:
    - name: Testcase failed
      debug:
        msg: "{{ Status_Fail }}"

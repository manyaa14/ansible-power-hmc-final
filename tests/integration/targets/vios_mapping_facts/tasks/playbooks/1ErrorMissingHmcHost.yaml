---
- name: "TC1 - Error: missing hmc_host"
  block:
    - name: Run vios_mapping_facts without hmc_host
      vios_mapping_facts:
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vios_name: "{{ vios_name }}"
        state: facts
      register: result
      ignore_errors: true

    - name: Verify task failed with missing hmc_host error
      assert:
        that:
          - result is failed
          - result is not changed
          - "'hmc_host' in result.msg"
        fail_msg: "{{ Status_Fail }}"
  rescue:
    - name: Testcase failed
      debug:
        msg: "{{ Status_Fail }}"

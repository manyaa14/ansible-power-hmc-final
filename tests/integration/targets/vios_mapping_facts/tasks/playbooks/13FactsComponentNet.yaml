---
- name: "TC13 - Facts: component is net"
  block:
    - name: Run vios_mapping_facts with component net
      vios_mapping_facts:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vios_name: "{{ vios_name }}"
        component: net
        state: facts
      register: result

    - name: Verify task succeeded and net mapping_facts returned
      assert:
        that:
          - result is success
          - result is not changed
          - result.mapping_facts is defined or result.warning is defined
        fail_msg: "{{ Status_Fail }}"
  rescue:
    - name: Testcase failed
      debug:
        msg: "{{ Status_Fail }}"

---
- name: "TC20 - Facts: net with unavailable physloc (no mappings found warning)"
  block:
    - name: Run vios_mapping_facts with component net and unavailable physloc
      vios_mapping_facts:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vios_name: "{{ vios_name }}"
        component: net
        physloc: "{{ physloc_net }}"
        state: facts
      register: result

    - name: Verify task succeeded with no mapping_facts or warning about no mappings
      assert:
        that:
          - result is success
          - result is not changed
          - result.warning is defined or result.mapping_facts is defined
        fail_msg: "{{ Status_Fail }}"
  rescue:
    - name: Testcase failed
      debug:
        msg: "{{ Status_Fail }}"

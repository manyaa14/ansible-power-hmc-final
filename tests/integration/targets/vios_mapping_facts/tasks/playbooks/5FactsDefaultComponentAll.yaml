---
- name: "TC5 - Facts: no component specified (defaults to all)"
  block:
    - name: Run vios_mapping_facts with no component (default all)
      vios_mapping_facts:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vios_name: "{{ vios_name }}"
        state: facts
      register: result

    - name: Verify task succeeded and mapping_facts is returned
      assert:
        that:
          - result is success
          - result is not changed
          - result.mapping_facts is defined
        fail_msg: "{{ Status_Fail }}"
  rescue:
    - name: Testcase failed
      debug:
        msg: "{{ Status_Fail }}"

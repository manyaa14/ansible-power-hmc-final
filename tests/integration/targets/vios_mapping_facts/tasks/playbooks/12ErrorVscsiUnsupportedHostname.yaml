---
- name: "TC12 - Error: vscsi with unsupported hostname parameter"
  block:
    - name: Run vios_mapping_facts with component vscsi and hostname (unsupported)
      vios_mapping_facts:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vios_name: "{{ vios_name }}"
        component: vscsi
        hostname: "{{ hostname }}"
        state: facts
      register: result
      ignore_errors: true

    - name: Verify task failed with unsupported hostname parameter error
      assert:
        that:
          - result is failed
          - result is not changed
          - "'hostname' in result.msg"
        fail_msg: "{{ Status_Fail }}"
  rescue:
    - name: Testcase failed
      debug:
        msg: "{{ Status_Fail }}"

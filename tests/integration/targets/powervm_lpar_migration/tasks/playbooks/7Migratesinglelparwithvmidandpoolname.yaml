---
- name: Migrate single LPAR using vm_id with shared pool name in shared_proc_pool
  block:
    - name: Migrate vm_id4 with shared proc pool name
      powervm_lpar_migration:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        src_system: "{{ src_system }}"
        dest_system: "{{ dest_system }}"
        vm_ids:
          - "{{ vm_id4 }}"
        shared_proc_pool:
          - lpar_id: 7
            pool_name: "{{ pool_name1 }}"
        action: migrate
      register: result

    - name: Display result
      debug:
        msg: "{{ result }}"

    - assert:
        that:
          - result is success
          - result is changed

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

---
- name: Migrate single LPAR using vm_name with shared pool id in shared_proc_pool
  block:
    - name: Migrate vm_name1 with shared proc pool id
      powervm_lpar_migration:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        src_system: "{{ src_system }}"
        dest_system: "{{ dest_system }}"
        vm_names:
          - "{{ vm_name1 }}"
        shared_proc_pool:
          - lpar_name: "{{ vm_name1 }}"
            pool_id: "{{ pool_id1 }}"
        action: migrate
      register: result

    - name: Display result
      debug:
        msg: "{{ result }}"

    - assert:
        that:
          - result is success
          - result is changed

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

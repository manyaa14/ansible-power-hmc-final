---
- name: Migrate single LPAR using vm_name with shared pool name in shared_proc_pool
  block:
    - name: Migrate vm_name2 with shared proc pool name
      powervm_lpar_migration:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        src_system: "{{ src_system }}"
        dest_system: "{{ dest_system }}"
        vm_names:
          - "{{ vm_name2 }}"
        shared_proc_pool:
          - lpar_name: "{{ vm_name2 }}"
            pool_name: "{{ pool_name2 }}"
        action: migrate
      register: result

    - name: Display result
      debug:
        msg: "{{ result }}"

    - assert:
        that:
          - result is success
          - result is changed

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

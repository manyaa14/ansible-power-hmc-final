---
- name: Verify that we are able to run adhoc command on hmc
  block:
    - name: Run adhoc command on HMC
      hmc_command:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        cmd: "{{ cmd }}"
      register: result

    - assert: 
        that:
          - result is changed
          - result is success

  rescue:
    - name: Mark the Testcase as FAILED
      debug:
        msg: "{{ status_fail }}" 


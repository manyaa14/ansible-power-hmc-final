- name: Verify that user is allowed to run multiple commands 
  block:
    - name: Run adhoc command on HMC
      hmc_command:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        cmd: "{{ item }}"
      register: result
      loop: "{{ commands }}"

    - assert:
        that:
          - result is changed
          - result is success

  rescue:
    - name: Mark the Testcase as FAILED
      debug:
        msg: "{{ status_fail }}"


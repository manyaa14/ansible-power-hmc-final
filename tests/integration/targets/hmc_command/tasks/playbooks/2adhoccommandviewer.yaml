- name: Create hmc_viewer user & try to run command
  block:
    - name: Create hmc viewer user
      hmc_user:
        state: present
        hmc_host: "{{ inventory_hostname }}"
        name: "{{ username }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        attributes:
          passwd: "{{ passwd }}"
          taskrole: "{{ taskrole }}"
      register: result

    - name: Output created hmcviewer details
      debug:
        msg: "{{ result }}"

    - assert:
        that:
          - result is success
          - result is changed

    - name: Run adhoc command on HMC
      hmc_command:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth:
          username: "{{ username }}"
          password: "{{ passwd }}"
        cmd: "{{ cmd }}"
      register: result
      ignore_errors: yes
    
    - assert:
        that:
          - result is failed
          - result is not changed
          - '"HmcError:" in result.msg'
          - '"The user does not have the appropriate authority." in result.msg'
  rescue:
    - name: Mark the status as FAILED
      debug:
        msg: "{{ status_fail }}" 

- name: VIOS Create
  block:
    - name: Create Virtual IO Server
      vios:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        name: "{{ name + '4' }}"
        settings:
          sync_curr_profile: "{{ sync_curr_profile }}" 
          hardware_mem_encryption: "{{ hardware_mem_encryption }}"
          secure_boot: "{{ secure_boot }}"
          keystore_kbytes: "{{ keystore_kbytes }}"
        state: present
      register: testout

    - name: Stdout the created VIOS details
      debug:
        msg: '{{ testout }}'

    - name: Verify that vios gets created successfully
      assert:
        that:
          - testout is changed
          - testout is success

  rescue:
    - name: Mark the TC as Failed
      debug:
        msg: "{{ Status_Fail }}"
     


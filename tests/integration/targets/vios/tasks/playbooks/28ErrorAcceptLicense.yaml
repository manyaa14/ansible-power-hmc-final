- name: Error- when Invalid Parameters are mentioned for accept_license
  block:
    - name: Error- when Invalid Parameters are mentioned for accept_license
      vios:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        nim_IP: "{{ nim_IP }}"
        nim_gateway: "{{ nim_gateway }}"
        vios_IP: "{{ vios_IP }}"
        nim_subnetmask: "{{ nim_subnetmask }}"
        timeout: "{{ timeout }}"
        prof_name: "{{ prof_name }}"
        nim_vlan_priority: "{{ nim_vlan_priority }}"
        nim_vlan_id: "{{ nim_vlan_id }}"
        name: "{{ name + 'Install' }}"
        action: accept_license
      register: testout
      ignore_errors: yes
  
    - name: Stdout the created logical partition
      debug:
        msg: '{{ testout }}'

    - name: Assert the Error
      assert:
        that:
          - "'ParameterError: unsupported parameters: nim_IP, nim_gateway, vios_IP, nim_subnetmask, prof_name, nim_vlan_id, nim_vlan_priority, timeout' in testout.msg"
          - testout is not changed
          - testout is failed

  rescue:
    - name: Mark the TC as FAILED
      debug:
        msg: "{{ Status_Fail }}"

  

- name: Error-when Invalid setting attribue is specified
  block:
    - name: Error-when Invalid setting attribue is specified
      vios:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        name: "{{ name + 'err' }}"
        settings:
          profile_name: "{{ profile_name }}"
          test: abc123
        state: present
      register: testout
      ignore_errors: yes

    - name: Stdout the created VIOS
      debug:
        msg: '{{ testout }}'

    - name : Verify that Vios
      assert:
        that:
          - testout is not changed
          - testout is failed
          - "'ParameterError: Invalid attributes: TEST' in testout.msg"

  rescue:
    - name: Mark the TC as FAILED
      debug:
        msg: "{{ Status_Fail }}"


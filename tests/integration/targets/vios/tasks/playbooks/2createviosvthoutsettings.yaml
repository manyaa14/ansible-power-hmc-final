- name: Create VIOS
  block:
    - name: Create Virtual IO Server without settings
      vios:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        name: "{{ name + '2' }}"
        state: present
      register: testout

    - name: Stdout the created VIOS details
      debug:
        msg: '{{ testout }}'

    - name: Verify that vios gets created without settings
      assert:
        that:
          - testout is changed
          - testout is success

  rescue:
    - name: Mark the Testcase as FAILED
      debug:
        msg: "Failed to create VIOS"

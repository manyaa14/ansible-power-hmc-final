- name: Create Virtual IO Server
  block:
    - name: Create Virtual IO Server
      vios:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        name: "{{ name + '8' }}"
        settings:
          io_slots: "{{ io_slots }}"
          auto_start: "{{ auto_start }}"
          boot_mode: "{{ boot_mode }}"
          power_ctrl_lpar_ids: "{{ power_ctrl_lpar_ids }}"
          conn_monitoring: "{{ conn_monitoring }}"
          max_virtual_slots: "{{ max_virtual_slots }}"
        state: present
      register: testout

    - name: Stdout the created VIOS details
      debug:
        msg: '{{ testout }}'

    - name: Verify that VIOS gets created successfully
      assert:
        that:
          - testout is success
          - testout is changed

  rescue:
    - name: Mark the TC as FAILED
      debug:
        msg: "{{ Status_Fail }}"

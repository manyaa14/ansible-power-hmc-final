- name: Error-when timeout <10
  block:
    - name: Error-when timeout <10
      vios:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        name: "{{ name + 'install' }}"
        nim_IP: "{{ nim_IP }}"
        nim_gateway: "{{ nim_gateway }}"
        vios_IP: "{{ vios_IP }}"
        nim_subnetmask: "{{ nim_subnetmask }}"
        timeout: 1
        prof_name: "{{ prof_name }}"
        nim_vlan_priority: "{{ nim_vlan_priority }}"
        nim_vlan_id: "{{ nim_vlan_id }}"
        action: install
      register: testout
      ignore_errors: yes

    - name: Stdout the created logical partition
      debug:
        msg: '{{ testout }}'
  
    - name: Assert the timeout
      assert:
        that:
          - testout is failed
          - testout is not changed
          - "'timeout should be more than 10mins' in testout.msg"

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"
  

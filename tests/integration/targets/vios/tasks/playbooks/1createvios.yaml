- name: VIOS Creation Testcases
  block:
    - name: Create Virtual IO Server
      vios:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        name: "{{ name }}"
        settings:
          profile_name: "{{ profile_name }}"
        state: present
      register: testout

    - name: Stdout the created VIOS
      debug:
        msg: '{{ testout }}'

    - name : Verify that Vios creation is successfull
      assert:
        that:
          - testout is changed
          - testout is success

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "VIOS Creation FAILED"

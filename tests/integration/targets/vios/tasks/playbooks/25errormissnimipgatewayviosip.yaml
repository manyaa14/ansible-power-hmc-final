- name: Error when we miss nim_subnetmask,gateway,nim_ip,vios_ip
  block:
    - name: Error when we miss nim_subnetmask,gateway,nim_ip,vios_ip
      vios:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        name: "{{ name }}"
        timeout: "{{ timeout }}"
        action: install
      register: testout
      ignore_errors: yes

    - name: Stdout the created logical partition
      debug:
        msg: '{{ testout }}'

    - name: Verify error when we miss nim_subnetmask,gateway,nim_ip,vios_ip
      assert:
        that:
          - testout is failed
          - testout is not changed
          - "'action is install but all of the following are missing: vios_IP' in testout.msg"

  rescue:
    - name: Mark the TC as FAILED
      debug:
        msg: "{{ Status_Fail }}"


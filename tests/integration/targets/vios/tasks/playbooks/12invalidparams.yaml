- name: Error when min_num_huge_pages, max_num_huge_pages, lpar_name, load_source_slot, console_slot, op_console_slot, hsl_pool_id are mentioned
  block:
    - name: Error when min_num_huge_pages, max_num_huge_pages, lpar_name, load_source_slot, console_slot, op_console_slot, hsl_pool_id are mentioned
      vios:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        name: "{{ name + '12' }}"
        settings:
          min_num_huge_pages: "{{ min_num_huge_pages }}"
          max_num_huge_pages: "{{ max_num_huge_pages }}"
          lpar_name: "{{ lpar_name }}"
          desired_io_entitled_mem: "{{ desired_io_entitled_mem }}"
          load_source_slot: "{{ load_source_slot }}"
          console_slot: "{{ console_slot }}"
          op_console_slot: "{{ op_console_slot }}"
          hsl_pool_id: "{{ hsl_pool_id }}"
        state: present
      register: testout
      ignore_errors: yes

    - name: Verify that VIOS gets created successfully
      assert:
        that:
          - testout is failed
          - testout is not changed
          - "'ParameterError: Invalid parameters: min_num_huge_pages, max_num_huge_pages, lpar_name, load_source_slot, console_slot, op_console_slot, hsl_pool_id' in testout.msg"

  rescue:
    - name: Mark the TC as FAILED
      debug:
        msg: "{{ Status_Fail }}"

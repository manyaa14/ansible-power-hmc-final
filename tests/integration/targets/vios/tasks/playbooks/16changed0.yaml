- name: Verify that changed=0 comes when we try to create already existing user
  block:
    - name: Verify that changed=0 comes when we try to create already existing user
      vios:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        name: "{{ name }}"
        settings:
          profile_name: "{{ profile_name }}"
        state: present
      register: testout

    - name: Stdout the created VIOS
      debug:
        msg: '{{ testout }}'

    - name : Verify that changed=0 comes when we try to create already existing user
      assert:
        that:
          - testout is not changed
          - testout is success

  rescue:
    - name: Mark the TC as FAILED
      debug:
        msg: "{{ Status_Fail }}"


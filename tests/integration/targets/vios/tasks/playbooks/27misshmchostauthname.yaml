- name: Error-when we miss hmc_host,hmc_auth,name,viosip
  block:
    - name: Error-when we miss hmc_host,hmc_auth,name,viosip
      vios:
        nim_gateway: "{{ nim_gateway }}"
        nim_subnetmask: "{{ nim_subnetmask }}"
        timeout: "{{ timeout }}"
        prof_name: "{{ prof_name }}"
        nim_vlan_priority: "{{ nim_vlan_priority }}"
        nim_vlan_id: "{{ nim_vlan_id }}"
        action: install
      register: testout
      ignore_errors: yes

    - name: Stdout the created logical partition
      debug:
        msg: '{{ testout }}'

    - name: Error when we miss hmc_host, hmc_auth, system_name, name
      assert:
        that:
          - testout is failed
          - testout is not changed
          - "'missing required arguments: hmc_auth, hmc_host' in testout.msg"

  rescue:
    - name: Mark the TC as FAILED
      debug:
        msg: "{{ Status_Fail }}"


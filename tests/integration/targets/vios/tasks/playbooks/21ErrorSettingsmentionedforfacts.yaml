- name: Error-when settings mentioned for Vios Facts
  block:
    - name: Error-when settings mentioned for Vios Facts
      vios:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        name: "{{ name }}"
        settings:
          lpar_env: "{{ lpar_env }}"
        state: facts
      register: testout
      ignore_errors: yes

    - name: Stdout the created logical partition
      debug:
        msg: '{{ testout }}'

    - name: Error-when settings mentioned for Vios Facts
      assert:
        that:
          - testout is not changed
          - testout is failed 
          - "'ParameterError: unsupported parameter: settings' in testout.msg"

  rescue:
    - name: Mark the TC as FAILED
      debug:
        msg: "{{ Status_Fail }}"


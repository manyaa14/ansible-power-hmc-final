- name: Error-when settings mentioned for install action
  block:
    - name: Error-when settings mentioned for install action
      vios:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        name: "{{ name }}"
        nim_IP: "{{  nim_IP }}"
        nim_gateway: "{{ nim_gateway }}"
        vios_IP: "{{ vios_IP }}"
        nim_subnetmask: "{{ nim_subnetmask }}"
        timeout: "{{ timeout }}"
        settings:
          lpar_env: "{{ lpar_env }}"
        prof_name: "{{ prof_name }}"
        nim_vlan_priority: "{{ nim_vlan_priority }}"
        nim_vlan_id: "{{ nim_vlan_id }}"
        action: install
      register: testout
      ignore_errors: yes

    - name: Verify the error comes when settings mentioned for license
      assert:
        that:
          - testout is failed
          - testout is not changed
          - "'ParameterError: unsupported parameter: settings' in testout.msg"

  rescue:
    - name: Mark the TC as FAILED
      debug:
        msg: "{{ Status_Fail }}"


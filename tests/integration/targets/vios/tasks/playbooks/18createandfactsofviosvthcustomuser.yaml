- name: Create hmc local user
  block:
    - name: Create hmc local user 
      hmc_user:
        state: present
        hmc_host: "{{ inventory_hostname }}"
        name: "{{ customuser }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        attributes:
          authentication_type: local
          passwd: abcd1234
          taskrole: hmcsuperadmin
      register: result

    - name: Output Users
      debug:
        msg: "{{ result }}"

    - name: Create Virtual IO Server
      vios:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth:
          username: "{{ customuser }}"
          password: "{{ customuser_passwd }}"
        system_name: "{{ system_name }}"
        name: "{{ name + 'customizeduser' }}"
        state: present
      register: testout

    - name: Stdout the created VIOS
      debug:
        msg: '{{ testout }}'

    - name : Verify that Vios creation is successfull
      assert:
        that:
         - testout is changed
         - testout is success

  rescue:
    - name: Mark the TC as FAILED
      debug:
        msg: "{{ Status_Fail }}"


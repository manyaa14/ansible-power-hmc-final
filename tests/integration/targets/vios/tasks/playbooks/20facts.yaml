- name: Fetch VIOS Facts
  block:
    - name: Fetch VIOS Facts
      vios:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        name: "{{ name }}"
        state: facts
      register: testout

    - name: Stdout the VIOS Facts
      debug:
        msg: '{{ testout }}'

    - name: Vios Facts
      assert:
        that:
          - testout is not changed
          - testout is success

  rescue:
    - name: Mark the TC as FAILED
      debug:
        msg: "{{ Status_Fail }}"

   

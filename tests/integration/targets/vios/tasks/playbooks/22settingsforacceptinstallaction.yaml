- name: Error-when settings mentioned for Accept Licence
  block:
    - name: Error-when settings mentioned for Accept Licence
      vios:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        name: "{{ name }}"
        settings:
          lpar_env: "{{ lpar_env }}"
        action: accept_license
      register: testout
      ignore_errors: yes

    - name: Verify the error comes when settings mentioned for accept license
      assert:
        that:
          - testout is failed
          - testout is not changed
          - "'ParameterError: unsupported parameter: settings' in testout.msg"

  rescue:
    - name: Mark the TC as FAILED
      debug:
        msg: "{{ Status_Fail }}"


---
- name: Verify error when save is provided without image_name for NFS update
  block:
    - name: Update vios using NFS with save=true but without image_name
      vios_update_upgrade:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        attributes:
          repository: nfs
          system_name: "{{ system_name_mtms }}"
          vios_id: "{{ vios_id }}"
          host_name: "{{ nfs_host }}"
          mount_loc: "{{ mount_loc }}"
          restart: true
          save: true
        state: updated
      register: result
      ignore_errors: yes

    - assert:
        that:
          - result is failed
          - result is not changed
          - "'image_name' in result.msg"

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

---
- name: Verify error when unsupported parameter disks is provided for disk update
  block:
    - name: Update vios using disk with unsupported disks parameter
      vios_update_upgrade:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        attributes:
          repository: disk
          vios_id: "{{ vios_id }}"
          system_name: "{{ system_name }}"
          image_name: "{{ image_name }}"
          disks:
            - hdisk1
        state: updated
      register: result
      ignore_errors: yes

    - assert:
        that:
          - result is failed
          - result is not changed
          - "'unsupported parameter: disks' in result.msg"

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

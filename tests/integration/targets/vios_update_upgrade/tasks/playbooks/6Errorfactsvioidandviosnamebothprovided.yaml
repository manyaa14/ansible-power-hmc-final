---
- name: Verify error when both vios_id and vios_name are provided for facts state
  block:
    - name: Get facts with both vios_id and vios_name (mutually exclusive)
      vios_update_upgrade:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        attributes:
          vios_name: "{{ vios_name }}"
          vios_id: "{{ vios_id }}"
          system_name: "{{ system_name }}"
        state: facts
      register: result
      ignore_errors: yes

    - assert:
        that:
          - result is failed
          - result is not changed
          - "'mutually exclusive' in result.msg"

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

---
- name: Verify error when vios details are missing for SFTP update
  block:
    - name: Update vios using SFTP without vios_id or vios_name
      vios_update_upgrade:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        attributes:
          repository: sftp
          system_name: "{{ system_name }}"
        state: updated
      register: result
      ignore_errors: yes

    - assert:
        that:
          - result is failed
          - result is not changed
          - "'Missing VIOS details' in result.msg"

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

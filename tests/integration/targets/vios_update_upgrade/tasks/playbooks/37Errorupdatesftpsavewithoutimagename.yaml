---
- name: Verify error when save is provided without image_name for SFTP update
  block:
    - name: Update vios using SFTP with save=true but without image_name
      vios_update_upgrade:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        attributes:
          repository: sftp
          vios_id: "{{ vios_id }}"
          system_name: "{{ system_name_mtms }}"
          user_id: "{{ sftp_user }}"
          host_name: "{{ sftp_host }}"
          ssh_key_file: "{{ ssh_key_file }}"
          restart: true
          save: true
        state: updated
      register: result
      ignore_errors: yes

    - assert:
        that:
          - result is failed
          - result is not changed
          - "'image_name' in result.msg"

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

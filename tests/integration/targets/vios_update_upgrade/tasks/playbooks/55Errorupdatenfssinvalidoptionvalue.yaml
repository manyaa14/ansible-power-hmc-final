---
- name: Verify error when invalid option value is provided for NFS update
  block:
    - name: Update vios using NFS with invalid option value (not 3 or 4)
      vios_update_upgrade:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        attributes:
          repository: nfs
          system_name: "{{ system_name_mtms }}"
          vios_id: "{{ vios_id }}"
          host_name: "{{ nfs_host }}"
          mount_loc: "{{ mount_loc }}"
          restart: true
          save: true
          image_name: "{{ image_name }}"
          option: test
        state: updated
      register: result
      ignore_errors: yes

    - assert:
        that:
          - result is failed
          - result is not changed
          - "'option' in result.msg"

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

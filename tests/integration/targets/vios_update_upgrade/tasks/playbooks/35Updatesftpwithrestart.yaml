---
- name: Update vios using SFTP with restart option
  block:
    - name: Update using SFTP with restart=true
      vios_update_upgrade:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        attributes:
          repository: sftp
          vios_id: "{{ vios_id }}"
          system_name: "{{ system_name_mtms }}"
          user_id: "{{ sftp_user }}"
          host_name: "{{ sftp_host }}"
          ssh_key_file: "{{ ssh_key_file }}"
          restart: true
        state: updated
      register: result

    - name: Display result
      debug:
        msg: "{{ result }}"

    - assert:
        that:
          - result is success

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

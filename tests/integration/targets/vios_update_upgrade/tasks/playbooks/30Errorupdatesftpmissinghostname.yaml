---
- name: Verify error when host_name is missing for SFTP update
  block:
    - name: Update vios using SFTP without host_name
      vios_update_upgrade:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        attributes:
          repository: sftp
          vios_id: "{{ vios_id }}"
          system_name: "{{ system_name }}"
          user_id: "{{ sftp_user }}"
        state: updated
      register: result
      ignore_errors: yes

    - assert:
        that:
          - result is failed
          - result is not changed
          - "'Either 'ssh_key_file' or 'password' is mandatory' in result.msg"

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

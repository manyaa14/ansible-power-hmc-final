---
- name: Update vios using disk with vios_name
  block:
    - name: Update using disk repository with vios_name and image_name
      vios_update_upgrade:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        attributes:
          repository: disk
          vios_name: "{{ vios_name }}"
          system_name: "{{ system_name }}"
          image_name: "{{ image_name }}"
        state: updated
      register: result

    - name: Display result
      debug:
        msg: "{{ result }}"

    - assert:
        that:
          - result is success

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

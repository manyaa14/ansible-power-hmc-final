---
- name: Update vios using SFTP with vios_id and password
  block:
    - name: Update using SFTP with vios_id and password authentication
      vios_update_upgrade:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        attributes:
          repository: sftp
          vios_id: "{{ vios_id }}"
          system_name: "{{ system_name }}"
          user_id: "{{ sftp_user }}"
          host_name: "{{ sftp_host }}"
          password: "{{ sftp_password }}"
        state: updated
      register: result

    - name: Display result
      debug:
        msg: "{{ result }}"

    - assert:
        that:
          - result is success

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

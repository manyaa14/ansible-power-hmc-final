---
- name: Verify error when mount_loc is missing for NFS update
  block:
    - name: Update vios using NFS without mount_loc
      vios_update_upgrade:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        attributes:
          repository: nfs
          system_name: "{{ system_name }}"
          vios_id: "{{ vios_id }}"
          host_name: "{{ nfs_host }}"
        state: updated
      register: result
      ignore_errors: yes

    - assert:
        that:
          - result is failed
          - result is not changed
          - "'mount_loc' in result.msg"

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

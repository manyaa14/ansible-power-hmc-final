---
- name: Verify error when host_name is missing for NFS update
  block:
    - name: Update vios using NFS without host_name
      vios_update_upgrade:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        attributes:
          repository: nfs
          system_name: "{{ system_name }}"
          vios_id: "{{ vios_id }}"
          mount_loc: "{{ mount_loc }}"
        state: updated
      register: result
      ignore_errors: yes

    - assert:
        that:
          - result is failed
          - result is not changed
          - "'host_name' in result.msg"

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

---
- name: Verify error when image_name is missing for disk update
  block:
    - name: Update vios using disk without image_name
      vios_update_upgrade:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        attributes:
          repository: disk
          vios_id: "{{ vios_id }}"
          system_name: "{{ system_name }}"
        state: updated
      register: result
      ignore_errors: yes

    - assert:
        that:
          - result is failed
          - result is not changed
          - "'image_name' in result.msg"

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

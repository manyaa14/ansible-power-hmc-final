---
- name: Verify error when system_name is missing for facts state
  block:
    - name: Get vios version with only vios_id (no system_name)
      vios_update_upgrade:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        attributes:
          vios_id: "{{ vios_id }}"
        state: facts
      register: result
      ignore_errors: yes

    - assert:
        that:
          - result is failed
          - result is not changed
          - "'system_name' in result.msg"

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

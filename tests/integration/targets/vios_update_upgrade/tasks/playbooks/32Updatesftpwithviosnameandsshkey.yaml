---
- name: Update vios using SFTP with vios_name and ssh_key_file
  block:
    - name: Update using SFTP with vios_name and SSH key file authentication
      vios_update_upgrade:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        attributes:
          repository: sftp
          vios_name: "{{ vios_name }}"
          system_name: "{{ system_name }}"
          user_id: "{{ sftp_user }}"
          host_name: "{{ sftp_host }}"
          ssh_key_file: "{{ ssh_key_file }}"
        state: updated
      register: result

    - name: Display result
      debug:
        msg: "{{ result }}"

    - assert:
        that:
          - result is success

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

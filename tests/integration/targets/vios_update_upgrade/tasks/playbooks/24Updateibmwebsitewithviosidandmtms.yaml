---
- name: Update vios using ibmwebsite with vios_id and MTMS system_name
  block:
    - name: Update using ibmwebsite with vios_id and MTMS
      vios_update_upgrade:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        attributes:
          repository: ibmwebsite
          system_name: "{{ system_name_mtms }}"
          vios_id: "{{ vios_id }}"
          image_name: "{{ image_name }}"
        state: updated
      register: result

    - name: Display result
      debug:
        msg: "{{ result }}"

    - assert:
        that:
          - result is success

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

---
- name: Update vios using NFS with save, image_name, option and directory
  block:
    - name: Update using NFS with all optional parameters
      vios_update_upgrade:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        attributes:
          repository: nfs
          system_name: "{{ system_name_mtms }}"
          vios_id: "{{ vios_id }}"
          host_name: "{{ nfs_host }}"
          mount_loc: "{{ mount_loc }}"
          restart: true
          save: true
          image_name: "{{ image_name }}"
          option: "{{ option_value }}"
          directory: "{{ directory }}"
        state: updated
      register: result

    - name: Display result
      debug:
        msg: "{{ result }}"

    - assert:
        that:
          - result is success

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

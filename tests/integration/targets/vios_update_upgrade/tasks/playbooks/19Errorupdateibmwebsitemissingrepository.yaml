---
- name: Verify error when repository is missing for ibmwebsite update
  block:
    - name: Update vios without providing repository type
      vios_update_upgrade:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        attributes:
          system_name: "{{ system_name }}"
          vios_id: "{{ vios_id }}"
        state: updated
      register: result
      ignore_errors: yes

    - assert:
        that:
          - result is failed
          - result is not changed
          - "'repository' in result.msg"

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

- name: Verify that play reports error when userid,passwd,hostname mentioned for disk location type
  block:
    - name: Verify that play reports error when userid,passwd,hostname mentioned for disk location type
      hmc_update_upgrade:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: '{{ curr_hmc_auth }}'
        build_config:
          location_type: "{{ config_disk['location_type'] }}"
          passwd: "{{ config_sftp['passwd'] }}"
          hostname: "{{ config_ftp['hostname'] }}"
          build_file: "{{ config_ftp['build_file'] }}"
          userid: "{{ config_ftp['userid'] }}"
        state: upgraded
      register: upgraded_hmc_build_info
      ignore_errors: yes

    - name: Verify the result
      assert:
        that:
        - upgraded_hmc_build_info is failed
        - upgraded_hmc_build_info is not changed
        - "'ParameterError: unsupported parameters: userid, passwd, hostname' in updated_hmc_build_info.msg"

  rescue:
    - name: Mark the Testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"


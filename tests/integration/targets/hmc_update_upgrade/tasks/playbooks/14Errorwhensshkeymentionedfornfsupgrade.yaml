- name: Error-when sshkey_file mentioned for nfs upgrade
  block:
    - name: Error-when sshkey_file mentioned for nfs upgrade
      hmc_update_upgrade:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: '{{ curr_hmc_auth }}'
        build_config:
            location_type: "{{ config_nfs['location_type'] }}"
            hostname: "{{ config_nfs['hostname'] }}"
            mount_location: "{{ config_nfs['mount_location'] }}"
            sshkey_file: "{{ config_sftp_ssh['sshkey_file'] }}"
            build_file: "{{ config_nfs['build_file'] }}"
        state: upgraded
      register: updated_hmc_build_info
      ignore_errors: yes

    - name: Stdout the Probed HMC build info
      debug:
        msg: '{{ updated_hmc_build_info }}'

    - name: Verify the result
      assert:
        that:
          - updated_hmc_build_info is failed
          - updated_hmc_build_info is not changed
          - '"ParameterError: unsupported parameter: sshkey_file" in updated_hmc_build_info.msg'

  rescue:
  - name: Mark the Testcase as FAILED
    debug:
      msg: "{{ Status_Fail }}"




- name: Retrieve the facts for HMC
  block:
    - name: HMC Facts
      hmc_update_upgrade:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: '{{ curr_hmc_auth }}'
        build_config: 
          location_type: "{{ config_ftp['location_type'] }}"
          mount_location: "{{ config_nfs['mount_location'] }}"    
          passwd: "{{ config_sftp['passwd'] }}"
          hostname: "{{ config_ftp['hostname'] }}"
          build_file: "{{ config_ftp['build_file'] }}"
          userid: "{{ config_ftp['userid'] }}"
        state: facts
      register: facts_info
      ignore_errors: yes

    - name: Verify the result
      assert:
        that:
        - facts_info is failed
        - facts_info is not changed
        - "'ParameterError: not supporting build_config option' in facts_info.msg"

  rescue:
    - name: Mark the Testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"


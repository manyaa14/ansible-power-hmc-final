- name: Error-when mount_location mentioned for sftpupgrade
  block:
    - name: Error-when sshkey_file mentioned for ftpupgrade
      hmc_update_upgrade:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: '{{ curr_hmc_auth }}'
        build_config: 
          location_type: "{{ config_ftp['location_type'] }}"
          mount_location: "{{ config_nfs['mount_location'] }}"    
          passwd: "{{ config_sftp['passwd'] }}"
          hostname: "{{ config_ftp['hostname'] }}"
          build_file: "{{ config_ftp['build_file'] }}"
          userid: "{{ config_ftp['userid'] }}"
        state: upgraded
      register: updated_hmc_build_info
      ignore_errors: yes

    - name: Stdout the Probed HMC build info after update
      debug:
        msg: '{{ updated_hmc_build_info }}'

    - name: Verify the result
      assert:
        that:
        - updated_hmc_build_info is failed
        - updated_hmc_build_info is not changed
        - "'ParameterError: unsupported parameters: mount_location' in updated_hmc_build_info.msg"

  rescue:
    - name: Mark the Testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"


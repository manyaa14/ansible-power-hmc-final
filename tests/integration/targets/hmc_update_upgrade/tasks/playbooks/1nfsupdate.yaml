- name: List the HMC current build level
  block:
    - name: List the HMC current build level
      hmc_update_upgrade:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: '{{ curr_hmc_auth }}'
        state: facts
      register: build_info

    - name: Stdout the probed HMC build info
      debug:
        msg: '{{ build_info }}'

    - name: Update HMC from NFS
      hmc_update_upgrade:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: '{{ curr_hmc_auth }}'
        build_config: '{{ config_nfs }}'
        state: updated
      register: updated_hmc_build_info

    - name: Stdout the Probed HMC build info after update
      debug:
        msg: '{{ updated_hmc_build_info }}'

    - name: Verify the hmc level
      assert:
        that:
          - updated_hmc_build_info is success
          - updated_hmc_build_info is changed
#      - "'WARNING: HMC update completed, but the version remains same. Check if any MPTF missing or the HMC was at same level already.' in '{{ updated_hmc_build_info['warning'] }}'"

    - name: Update HMC from NFS
      hmc_update_upgrade:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: '{{ curr_hmc_auth }}'
        build_config: '{{ config_nfs }}'
        state: updated
      register: updated_hmc_build_info

    - name: Verify the hmc level
      assert:
        that:
          - updated_hmc_build_info is success
          - updated_hmc_build_info is not changed
          - "'WARNING: HMC update completed, but the version remains same. Check if any MPTF missing or the HMC was at same level already.' in updated_hmc_build_info['warning']"

  rescue:
    - name: Mark the Failure
      debug:
        msg: "TestCase Failed"




- name: Retrieve the facts for HMC
  block:
    - name: HMC Facts
      hmc_update_upgrade:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: '{{ curr_hmc_auth }}'
        state: facts
      register: facts_info
      ignore_errors: yes

    - name: Verify the result
      assert:
        that:
        - facts_info is success
        - facts_info is not changed

  rescue:
    - name: Mark the Testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"


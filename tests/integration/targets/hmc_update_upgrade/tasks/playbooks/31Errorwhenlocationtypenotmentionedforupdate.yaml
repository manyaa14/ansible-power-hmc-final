- name: Error-when location_type missing for disk update
  block:
    - name: Error-when sshkey_file,mount_location mentioned for diskupdate
      hmc_update_upgrade:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: '{{ curr_hmc_auth }}'
        build_config: 
        state: updated
      register: updated_hmc_build_info
      ignore_errors: yes

    - name: Verify the result
      assert:
        that:
        - updated_hmc_build_info is failed
        - updated_hmc_build_info is not changed
        - "'ParameterError: missing options on build_config' in updated_hmc_build_info.msg"

  rescue:
    - name: Mark the Testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"


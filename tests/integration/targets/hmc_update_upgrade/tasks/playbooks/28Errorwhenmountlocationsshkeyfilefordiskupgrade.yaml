- name: Error-when sshkey_file,mount_location mentioned for diskupdate
  block:
    - name: Error-when sshkey_file,mount_location mentioned for diskupgrade
      hmc_update_upgrade:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: '{{ curr_hmc_auth }}'
        build_config: 
          location_type: "{{ config_disk['location_type'] }}"
          mount_location: "{{ config_nfs['mount_location'] }}"
          sshkey_file: "{{ config_sftp_ssh['sshkey_file'] }}"    
          build_file: "{{ config_ftp['build_file'] }}"
        state: upgraded
      register: upgraded_hmc_build_info
      ignore_errors: yes

    - name: Verify the result
      assert:
        that:
        - upgraded_hmc_build_info is failed
        - upgraded_hmc_build_info is not changed
        - "'ParameterError: unsupported parameters: sshkey_file, mount_location' in upgraded_hmc_build_info.msg"

  rescue:
    - name: Mark the Testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"


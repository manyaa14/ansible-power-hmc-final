---
- name: Verify that we are able to run adhoc command to create custom user having no permission to power off & on cec
  block:
    - name: Power On the CEC with user having no permission to poweron
      power_system:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth:
          username: "{{ custom_user }}"
          password: "{{ custom_user_passwd }}"
        system_name: "{{ system_name }}"
        action: "{{ action_poweron }}"
      register: result
      ignore_errors: yes

    - name: Validate the state of cec
      assert:
        that:
          - result is failed
          - result is not changed
          # - '"The user does not have the appropriate authority." in result.msg'

  rescue:
    - name: Mark the Testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}" 

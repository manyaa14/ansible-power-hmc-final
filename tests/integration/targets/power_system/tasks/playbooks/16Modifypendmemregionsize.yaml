- name: Modify Pending Memory Region Size
  block:
    - name: Verify that play changes value of pend_mem_region_size successfully 
      power_system:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        pend_mem_region_size: "{{ pend_mem_region_size }}"
        action: "{{ action_modify_hwres }}"
      register: result

    - name: Verify the result
      assert:
        that:
          - result is changed
          - result is success

    - name: Verify that play changes pend_mem_size successfully
      power_system:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        pend_mem_region_size: "{{ revert_pend_mem_region_size }}"
        action: "{{ action_modify_hwres }}"
      register: result

    - name: Verify the result
      assert:
        that:
          - result is changed
          - result is success


  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"


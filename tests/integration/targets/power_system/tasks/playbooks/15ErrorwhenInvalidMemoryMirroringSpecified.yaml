- name: Verify that play reports error when invalid mem_mirroring_mode is specified
  block:
    - name: Change cec requested_num_sys_huge_pages
      power_system:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        mem_mirroring_mode: Invalid
        action: "{{ action_modify_hwres }}"
      register: result
      ignore_errors: yes

    - name: Verify the result
      assert:
        that:
          - '"value of mem_mirroring_mode must be one of: none, sys_firmware_only, got: Invalid" in result.msg'
          - result is not changed
          - result is failed

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"


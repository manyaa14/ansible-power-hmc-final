- name: Modify HugePages
  block:
    - name: Change cec requested_num_sys_huge_pages
      power_system:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        requested_num_sys_huge_pages: "{{ requested_num_sys_huge_pages }}"
        action: "{{ action_modify_hwres }}"
      register: result

    - name: Verify the result
      assert:
        that:
          - result is success
          - result is changed

    - name: Change cec requested_num_sys_huge_pages
      power_system:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        requested_num_sys_huge_pages: "{{ revert_requested_num_sys_huge_pages }}"
        action: "{{ action_modify_hwres }}"
      register: result

    - name: Verify the result
      assert:
        that:
          - result is success
          - result is changed

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"


       


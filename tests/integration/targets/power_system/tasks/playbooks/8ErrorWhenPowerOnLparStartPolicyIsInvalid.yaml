- name: power_on_lpar_start_policy testcases
  block:
    - name: Error When Invalid PowerOnLparStart Policy Specified
      power_system:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        power_on_lpar_start_policy: "Invalid"
        action: modify_syscfg
      register: result
      ignore_errors: yes

    - name: Verify the Result
      assert:
        that:
          - '"value of power_on_lpar_start_policy must be one of: autostart, userinit, autorecovery, got: Invalid" in result.msg'
          - result is failed
          - result is not changed

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"


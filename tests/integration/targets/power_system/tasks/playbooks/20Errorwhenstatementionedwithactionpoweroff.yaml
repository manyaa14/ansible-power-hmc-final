- name: Verify that action & state are mutually exclusive
  block:
    - name: Verify that action & state are mutually exclusive
      power_system:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        action: "{{ action_poweroff }}"
        state: "{{ state }}"
      register: result
      ignore_errors: yes

    - name: Verify the Result
      assert:
        that:
          - result is not changed
          - result is failed
          - '"parameters are mutually exclusive: state|action" in result.msg'

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"


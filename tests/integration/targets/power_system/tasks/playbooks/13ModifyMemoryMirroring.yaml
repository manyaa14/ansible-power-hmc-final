- name: Modify Memory Mirroring
  block:
    - name: Change memory mirroring mode
      power_system:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        mem_mirroring_mode: "{{ mem_mirroring_mode_sys_firmware_only }}"
        action: modify_hwres
      register: result

    - name: Verify the result
      assert:
        that:
          - result is changed
          - result is success

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"


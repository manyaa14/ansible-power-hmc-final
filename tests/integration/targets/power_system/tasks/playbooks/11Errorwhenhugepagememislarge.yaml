- name: Modify HugePages
  block:
    - name: Error-Verify that play reports error when requested_num_sys_huge_pages is too huge
      power_system:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        requested_num_sys_huge_pages: "{{ hugepage_greaterthan_cec_capability }}"
        action: "{{ action_modify_hwres }}"
      register: result
      ignore_errors: yes

    - name: Verify the result
      assert:
        that:
          - '"The requested number of huge pages exceeds the maximum of" in result.msg'
          - result is failed
          - result is not changed

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"


       


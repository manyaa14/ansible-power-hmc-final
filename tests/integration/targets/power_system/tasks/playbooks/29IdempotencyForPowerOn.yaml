- name: Verify that play follows Idempotency for Power_On
  block:
    - name: Verify that play follows Idempotency for Power_Om
      power_system:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        action: "{{ action_poweron }}"
      register: result
    
    - name: Validate the result
      assert:
        that:
          - result is success
          - result is not changed

  rescue:
    - name: Mark the Testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"

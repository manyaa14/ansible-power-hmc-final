- name: Poweron the Managed System
  block:
    - name: Power On the CEC
      power_system:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        action: "{{ action_poweron }}"
      register: result

    - name: Validate the state of cec
      assert:
        that:
          - result is success
          - result is changed

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "Failed to PowerOn the Managed System"

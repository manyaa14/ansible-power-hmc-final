---
- name: Verify error when both vios_name and vios_id are provided (mutually exclusive)
  block:
    - name: Create backup with vios_name and vios_id both set
      vios_maintenance:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        attributes:
          types: "{{ backup_types_ioconfig }}"
          system: "{{ system_name }}"
          vios_name: "{{ vios_name }}"
          vios_id: "1"
          backup_name: "{{ backup_name_ioconfig }}"
        state: present
      register: result
      ignore_errors: yes

    - assert:
        that:
          - result is failed
          - result is not changed
          - "'mutually exclusive' in result.msg"

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

---
- name: Rename a VIOS backup file
  block:
    - name: Modify backup file name
      vios_maintenance:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        attributes:
          types: "{{ backup_types_ssp }}"
          system: "{{ system_name }}"
          vios_name: "{{ vios_name }}"
          backup_name: "{{ modify_backup_name }}"
          new_name: "{{ new_backup_name }}"
        state: modify
      register: result

    - name: Display result
      debug:
        msg: "{{ result }}"

    - assert:
        that:
          - result is success
          - result is changed

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

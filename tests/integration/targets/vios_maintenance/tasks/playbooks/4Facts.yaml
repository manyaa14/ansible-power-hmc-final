---
- name: List VIOS backup file details (facts)
  block:
    - name: Get VIOS backup facts
      vios_maintenance:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        attributes:
          types: "{{ backup_types_ioconfig }}"
          system: "{{ system_name }}"
          vios_name: "{{ vios_name }}"
        state: facts
      register: result

    - name: Display result
      debug:
        msg: "{{ result }}"

    - assert:
        that:
          - result is success
          - result is not changed

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

---
- name: Create a Shared Storage Pool (ssp) backup
  block:
    - name: Create ssp backup file
      vios_maintenance:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        attributes:
          types: "{{ backup_types_ssp }}"
          system: "{{ system_name }}"
          vios_name: "{{ vios_name }}"
          backup_name: "{{ backup_name_ssp }}"
        state: present
      register: result

    - name: Display result
      debug:
        msg: "{{ result }}"

    - assert:
        that:
          - result is success
          - result is changed

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

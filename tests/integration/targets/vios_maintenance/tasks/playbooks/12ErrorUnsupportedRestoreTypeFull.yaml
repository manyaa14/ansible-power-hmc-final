---
- name: Verify error when types=vios is used for state=restore (only viosioconfig/ssp allowed)
  block:
    - name: Restore with unsupported types=vios
      vios_maintenance:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        attributes:
          types: "{{ backup_types_full }}"
          system: "{{ system_name }}"
          vios_name: "{{ vios_name }}"
          backup_name: "{{ restore_backup_name }}"
        state: restore
      register: result
      ignore_errors: yes

    - assert:
        that:
          - result is failed
          - result is not changed
          - "'viosioconfig or ssp' in result.msg"

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

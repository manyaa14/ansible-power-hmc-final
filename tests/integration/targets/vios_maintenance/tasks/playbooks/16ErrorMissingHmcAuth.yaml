---
- name: Verify error when hmc_auth is missing
  block:
    - name: Create backup without hmc_auth
      vios_maintenance:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth:
          username: ""
          password: ""
        attributes:
          types: "{{ backup_types_ioconfig }}"
          system: "{{ system_name }}"
          vios_name: "{{ vios_name }}"
          backup_name: "{{ backup_name_ioconfig }}"
        state: present
      register: result
      ignore_errors: yes

    - assert:
        that:
          - result is failed
          - result is not changed

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

---
- name: Verify error when both all and adapter_id are provided in sriov_adapter_update
  block:
    - name: Execute platform update with sriov info specifying both all and adapter_id
      platform_update:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        platform_config:
          system_firmware_update:
            update_type: NoUpdate
            update_order: 1
            sriov_adapter_update:
              - all: true
                adapter_id: "{{ sriov_adapter_id }}"
                subtype: DriverOnly
      register: result
      ignore_errors: yes

    - assert:
        that:
          - result is failed
          - result is not changed
          - "'mutually ex' in result.msg or 'adapter_id' in result.msg"

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

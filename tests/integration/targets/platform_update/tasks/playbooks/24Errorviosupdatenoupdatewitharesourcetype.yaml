---
- name: Verify error when resource_type is given with update_type NoUpdate in vios_update
  block:
    - name: Execute vios_update with NoUpdate and resource_type (unsupported combination)
      platform_update:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        platform_config:
          vios_update:
            - update_type: NoUpdate
              vios_name: "{{ vios_name }}"
              update_order: 1
              resource_type: IBMWebsite
              io_adapter_update:
                - all: true
                  repository: IBMWebsite
      register: result
      ignore_errors: yes

    - assert:
        that:
          - result is not changed

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

---
- name: Verify error when unsupported param is provided inside partition_migration
  block:
    - name: Execute platform update for partition migration with unsupported update_type param
      platform_update:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        platform_config:
          system_firmware_update:
            update_type: Update
            update_order: 1
          partition_migration:
            is_quick_evac: true
            destination_managed_system: "{{ dest_system }}"
            update_type: Update
      register: result
      ignore_errors: yes

    - assert:
        that:
          - result is failed
          - result is not changed
          - "'Unsupported' in result.msg"

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

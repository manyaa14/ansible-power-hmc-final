---
- name: Verify error when sriov_adapter_update is given with update_type Update for system_firmware_update
  block:
    - name: Execute platform update with sriov info when update_type is Update (invalid combination)
      platform_update:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        platform_config:
          system_firmware_update:
            update_type: Update
            update_order: 1
            sriov_adapter_update:
              - adapter_id: "{{ sriov_adapter_id }}"
                subtype: DriverOnly
      register: result
      ignore_errors: yes

    - assert:
        that:
          - result is failed
          - result is not changed
          - "'sriov_adapter_update' in result.msg"

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

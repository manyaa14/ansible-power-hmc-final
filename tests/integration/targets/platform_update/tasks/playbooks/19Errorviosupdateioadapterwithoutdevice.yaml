---
- name: Verify error when device is missing in io_adapter_update without specifying all
  block:
    - name: Execute platform update for vios_update io_adapter_update without device or all
      platform_update:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        platform_config:
          vios_update:
            - update_type: NoUpdate
              vios_name: "{{ vios_name }}"
              update_order: 1
              io_adapter_update:
                - repository: IBMWebsite
      register: result
      ignore_errors: yes

    - assert:
        that:
          - result is failed
          - result is not changed
          - "'device' in result.msg or 'all' in result.msg"

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

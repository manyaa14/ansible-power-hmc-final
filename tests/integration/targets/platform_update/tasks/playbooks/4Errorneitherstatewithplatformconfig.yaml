---
- name: Verify error when neither state nor platform_config is provided
  block:
    - name: Execute platform update without state or platform_config
      platform_update:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
      register: result
      ignore_errors: yes

    - assert:
        that:
          - result is failed
          - result is not changed
          - "'state' in result.msg or 'platform_config' in result.msg"

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

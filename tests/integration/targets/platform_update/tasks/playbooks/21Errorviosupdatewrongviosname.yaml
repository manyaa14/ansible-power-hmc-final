---
- name: Verify error when wrong vios_name is provided in vios_update
  block:
    - name: Execute vios_update with a vios_name that does not exist on the system
      platform_update:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        platform_config:
          vios_update:
            - update_type: Update
              vios_name: "{{ wrong_vios_name }}"
              update_order: 1
              resource_type: IBMWebsite
              vios_image_name: "{{ vios_image_name }}"
      register: result
      ignore_errors: yes

    - assert:
        that:
          - result is failed
          - result is not changed

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

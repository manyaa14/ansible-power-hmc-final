---
- name: Verify error when unsupported params are provided inside vios_update
  block:
    - name: Execute vios_update with unsupported adapter_id parameter
      platform_update:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        platform_config:
          vios_update:
            - update_type: Update
              vios_name: "{{ vios_name }}"
              update_order: 1
              resource_type: IBMWebsite
              vios_image_name: "{{ vios_image_name }}"
              adapter_id: "{{ sriov_adapter_id }}"
      register: result
      ignore_errors: yes

    - assert:
        that:
          - result is failed
          - result is not changed
          - "'Unsupported' in result.msg"

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

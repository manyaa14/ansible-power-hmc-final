---
- name: Verify error when sriov adapter_id provided but adapter is not present on system
  block:
    - name: Execute platform update with sriov adapter_id that does not exist on the system
      platform_update:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        platform_config:
          system_firmware_update:
            update_type: NoUpdate
            update_order: 1
            sriov_adapter_update:
              - adapter_id: "{{ sriov_adapter_id_not_present }}"
                subtype: DriverOnly
      register: result
      ignore_errors: yes

    - assert:
        that:
          - result is failed
          - result is not changed

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

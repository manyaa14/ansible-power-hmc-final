---
- name: Verify error when unsupported params are provided inside io_adapter_update
  block:
    - name: Execute vios_update io_adapter_update with unsupported vios_name parameter
      platform_update:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        platform_config:
          vios_update:
            - update_type: NoUpdate
              vios_name: "{{ vios_name }}"
              update_order: 1
              io_adapter_update:
                - all: true
                  repository: IBMWebsite
                  vios_name: "{{ vios_name }}"
      register: result
      ignore_errors: yes

    - assert:
        that:
          - result is failed
          - result is not changed
          - "'Unsupported' in result.msg"

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

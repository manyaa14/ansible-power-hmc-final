---
- name: Verify error when update_type is missing in vios_update
  block:
    - name: Execute platform update for vios_update without update_type
      platform_update:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        platform_config:
          vios_update:
            - vios_name: "{{ vios_name }}"
              update_order: 1
              resource_type: IBMWebsite
              vios_image_name: "{{ vios_image_name }}"
      register: result
      ignore_errors: yes

    - assert:
        that:
          - result is failed
          - result is not changed
          - "'update_type' in result.msg"

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

---
- name: "TC23 - Error: update_npiv with missing npiv_settings"
  block:
    - name: Run powervm_dlpar update_npiv without npiv_settings
      powervm_dlpar:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name }}"
        action: update_npiv
      register: result
      ignore_errors: true

    - name: Verify task failed with missing npiv_settings error
      assert:
        that:
          - result is failed
          - result is not changed
          - "'npiv_settings' in result.msg"
        fail_msg: "{{ Status_Fail }}"
  rescue:
    - name: Testcase failed
      debug:
        msg: "{{ Status_Fail }}"

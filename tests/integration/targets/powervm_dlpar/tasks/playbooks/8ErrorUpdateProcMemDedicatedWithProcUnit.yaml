---
- name: "TC8 - Error: update_proc_mem dedicated partition with proc_unit"
  block:
    - name: Run powervm_dlpar with dedicated partition and proc_unit setting
      powervm_dlpar:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name_dedicated }}"
        proc_settings:
          proc: "{{ proc }}"
          proc_unit: "{{ proc_unit }}"
        action: update_proc_mem
      register: result
      ignore_errors: true

    - name: Verify task failed - dedicated config does not support proc_unit
      assert:
        that:
          - result is failed
          - result is not changed
          - "'dedicated' in result.msg or 'proc unit' in result.msg or 'proc_unit' in result.msg"
        fail_msg: "{{ Status_Fail }}"
  rescue:
    - name: Testcase failed
      debug:
        msg: "{{ Status_Fail }}"

---
- name: "TC34 - Error: update_vod with unsupported mem_settings"
  block:
    - name: Run powervm_dlpar update_vod with mem_settings (unsupported)
      powervm_dlpar:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name }}"
        vod_settings:
          - vios_name: "{{ vios_name }}"
            device_name: "{{ device_name }}"
        mem_settings:
          mem: "{{ mem }}"
        action: update_vod
      register: result
      ignore_errors: true

    - name: Verify task failed with unsupported mem_settings error
      assert:
        that:
          - result is failed
          - result is not changed
          - "'mem_settings' in result.msg"
        fail_msg: "{{ Status_Fail }}"
  rescue:
    - name: Testcase failed
      debug:
        msg: "{{ Status_Fail }}"

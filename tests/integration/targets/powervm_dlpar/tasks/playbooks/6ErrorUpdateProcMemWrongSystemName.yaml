---
- name: "TC6 - Error: update_proc_mem with wrong system_name"
  block:
    - name: Run powervm_dlpar update_proc_mem with invalid system name
      powervm_dlpar:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "InvalidSystemXYZ"
        vm_name: "{{ vm_name }}"
        proc_settings:
          proc: "{{ proc }}"
        action: update_proc_mem
      register: result
      ignore_errors: true

    - name: Verify task failed with system not present error
      assert:
        that:
          - result is failed
          - result is not changed
          - "'Given system is not present' in result.msg"
        fail_msg: "{{ Status_Fail }}"
  rescue:
    - name: Testcase failed
      debug:
        msg: "{{ Status_Fail }}"

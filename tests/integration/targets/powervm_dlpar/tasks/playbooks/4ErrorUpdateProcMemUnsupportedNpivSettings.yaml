---
- name: "TC4 - Error: update_proc_mem with unsupported npiv_settings"
  block:
    - name: Run powervm_dlpar update_proc_mem with npiv_settings (unsupported)
      powervm_dlpar:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name }}"
        proc_settings:
          proc: "{{ proc }}"
        npiv_settings:
          - vios_name: "{{ vios_name }}"
            fc_port_name: "{{ fc_port_name }}"
        action: update_proc_mem
      register: result
      ignore_errors: true

    - name: Verify task failed with unsupported npiv_settings error
      assert:
        that:
          - result is failed
          - result is not changed
          - "'npiv_settings' in result.msg"
        fail_msg: "{{ Status_Fail }}"
  rescue:
    - name: Testcase failed
      debug:
        msg: "{{ Status_Fail }}"

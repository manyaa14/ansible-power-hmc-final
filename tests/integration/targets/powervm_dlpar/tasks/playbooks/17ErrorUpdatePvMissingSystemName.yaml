---
- name: "TC17 - Error: update_pv with missing system_name"
  block:
    - name: Run powervm_dlpar update_pv without system_name
      powervm_dlpar:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: ""
        vm_name: "{{ vm_name }}"
        pv_settings:
          - vios_name: "{{ vios_name }}"
            disk_name: "{{ disk_name }}"
        action: update_pv
      register: result
      ignore_errors: true

    - name: Verify task failed with missing system_name error
      assert:
        that:
          - result is failed
          - result is not changed
          - "'system_name' in result.msg"
        fail_msg: "{{ Status_Fail }}"
  rescue:
    - name: Testcase failed
      debug:
        msg: "{{ Status_Fail }}"

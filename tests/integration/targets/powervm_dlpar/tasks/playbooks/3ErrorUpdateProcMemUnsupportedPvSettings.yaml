---
- name: "TC3 - Error: update_proc_mem with unsupported pv_settings"
  block:
    - name: Run powervm_dlpar update_proc_mem with pv_settings (unsupported)
      powervm_dlpar:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name }}"
        proc_settings:
          proc: "{{ proc }}"
        pv_settings:
          - vios_name: "{{ vios_name }}"
            disk_name: "{{ disk_name }}"
        action: update_proc_mem
      register: result
      ignore_errors: true

    - name: Verify task failed with unsupported pv_settings error
      assert:
        that:
          - result is failed
          - result is not changed
          - "'pv_settings' in result.msg"
        fail_msg: "{{ Status_Fail }}"
  rescue:
    - name: Testcase failed
      debug:
        msg: "{{ Status_Fail }}"

---
- name: "TC14 - Update sharing mode on shared processor partition"
  block:
    - name: Run powervm_dlpar update_proc_mem updating sharing mode to uncapped
      powervm_dlpar:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name }}"
        proc_settings:
          sharing_mode: "{{ sharing_mode_uncapped }}"
          uncapped_weight: "{{ uncapped_weight }}"
        action: update_proc_mem
      register: result

    - name: Verify task succeeded and partition_info is returned
      assert:
        that:
          - result is success
          - result.partition_info is defined
        fail_msg: "{{ Status_Fail }}"
  rescue:
    - name: Testcase failed
      debug:
        msg: "{{ Status_Fail }}"

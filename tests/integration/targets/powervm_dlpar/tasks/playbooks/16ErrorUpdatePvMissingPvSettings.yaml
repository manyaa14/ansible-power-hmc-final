---
- name: "TC16 - Error: update_pv with missing pv_settings"
  block:
    - name: Run powervm_dlpar update_pv without pv_settings
      powervm_dlpar:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name }}"
        action: update_pv
      register: result
      ignore_errors: true

    - name: Verify task failed with missing pv_settings error
      assert:
        that:
          - result is failed
          - result is not changed
          - "'pv_settings' in result.msg"
        fail_msg: "{{ Status_Fail }}"
  rescue:
    - name: Testcase failed
      debug:
        msg: "{{ Status_Fail }}"

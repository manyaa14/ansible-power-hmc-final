---
- name: "TC1 - Error: update_proc_mem missing system_name"
  block:
    - name: Run powervm_dlpar with missing system_name
      powervm_dlpar:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        vm_name: "{{ vm_name }}"
        action: update_proc_mem
      register: result
      ignore_errors: true

    - name: Verify task failed with missing system_name error
      assert:
        that:
          - result is failed
          - result is not changed
          - "'system_name' in result.msg"
        fail_msg: "{{ Status_Fail }}"
  rescue:
    - name: Testcase failed
      debug:
        msg: "{{ Status_Fail }}"

---
- name: "TC30 - Error: update_vod with missing vod_settings"
  block:
    - name: Run powervm_dlpar update_vod without vod_settings
      powervm_dlpar:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name }}"
        action: update_vod
      register: result
      ignore_errors: true

    - name: Verify task failed with missing vod_settings error
      assert:
        that:
          - result is failed
          - result is not changed
          - "'vod_settings' in result.msg"
        fail_msg: "{{ Status_Fail }}"
  rescue:
    - name: Testcase failed
      debug:
        msg: "{{ Status_Fail }}"

---
- name: "TC10 - Error: update_proc_mem shared partition with dedicated sharing mode"
  block:
    - name: Run powervm_dlpar with shared partition and keep_idle_procs sharing mode
      powervm_dlpar:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name }}"
        proc_settings:
          proc_unit: "{{ proc_unit }}"
          sharing_mode: "{{ sharing_mode_dedicated }}"
        action: update_proc_mem
      register: result
      ignore_errors: true

    - name: Verify task failed - keep_idle_procs not supported with shared processor
      assert:
        that:
          - result is failed
          - result is not changed
          - "'sharing mode is not supported with shared' in result.msg"
        fail_msg: "{{ Status_Fail }}"
  rescue:
    - name: Testcase failed
      debug:
        msg: "{{ Status_Fail }}"

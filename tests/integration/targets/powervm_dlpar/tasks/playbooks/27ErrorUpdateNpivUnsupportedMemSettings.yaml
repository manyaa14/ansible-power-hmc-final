---
- name: "TC27 - Error: update_npiv with unsupported mem_settings"
  block:
    - name: Run powervm_dlpar update_npiv with mem_settings (unsupported)
      powervm_dlpar:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name }}"
        npiv_settings:
          - vios_name: "{{ vios_name }}"
            fc_port_name: "{{ fc_port_name }}"
        mem_settings:
          mem: "{{ mem }}"
        action: update_npiv
      register: result
      ignore_errors: true

    - name: Verify task failed with unsupported mem_settings error
      assert:
        that:
          - result is failed
          - result is not changed
          - "'mem_settings' in result.msg"
        fail_msg: "{{ Status_Fail }}"
  rescue:
    - name: Testcase failed
      debug:
        msg: "{{ Status_Fail }}"

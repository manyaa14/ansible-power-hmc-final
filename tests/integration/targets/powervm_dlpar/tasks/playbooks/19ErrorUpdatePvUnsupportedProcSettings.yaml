---
- name: "TC19 - Error: update_pv with unsupported proc_settings"
  block:
    - name: Run powervm_dlpar update_pv with proc_settings (unsupported)
      powervm_dlpar:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name }}"
        pv_settings:
          - vios_name: "{{ vios_name }}"
            disk_name: "{{ disk_name }}"
        proc_settings:
          proc: "{{ proc }}"
        action: update_pv
      register: result
      ignore_errors: true

    - name: Verify task failed with unsupported proc_settings error
      assert:
        that:
          - result is failed
          - result is not changed
          - "'proc_settings' in result.msg"
        fail_msg: "{{ Status_Fail }}"
  rescue:
    - name: Testcase failed
      debug:
        msg: "{{ Status_Fail }}"

---
- name: "TC2 - Error: update_proc_mem missing vm_name"
  block:
    - name: Run powervm_dlpar with missing vm_name
      powervm_dlpar:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        action: update_proc_mem
      register: result
      ignore_errors: true

    - name: Verify task failed with missing vm_name error
      assert:
        that:
          - result is failed
          - result is not changed
          - "'vm_name' in result.msg"
        fail_msg: "{{ Status_Fail }}"
  rescue:
    - name: Testcase failed
      debug:
        msg: "{{ Status_Fail }}"

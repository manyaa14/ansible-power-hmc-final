---
- name: Verify error when unsupported parameters are provided for firewall_facts state
  block:
    - name: Get firewall info with unsupported params (level, rule, file)
      vios_secure:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vios_name: "{{ vios_name }}"
        level: high
        rule: j
        file: kk.json
        state: firewall_facts
      register: result
      ignore_errors: yes

    - assert:
        that:
          - result is failed
          - result is not changed
          - "'unsupported parameters' in result.msg"

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

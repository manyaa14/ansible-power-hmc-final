---
- name: Verify getting security info for VIOS
  block:
    - name: Get security info with all mandatory params
      vios_secure:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vios_name: "{{ vios_name }}"
        state: setting_security
      register: result
      ignore_errors: yes

    - name: Display result
      debug:
        msg: "{{ result }}"

    - assert:
        that:
          - result is not changed

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

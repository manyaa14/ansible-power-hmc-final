---
- name: Verify error when port is missing in firewall_config for setting_firewall state
  block:
    - name: Configure firewall setting without port in firewall_config
      vios_secure:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vios_name: "{{ vios_name }}"
        firewall_config:
          - interface: "{{ firewall_interface }}"
            remote: true
            address: "{{ firewall_address }}"
            timeout: "{{ firewall_timeout }}"
            present: allow
        state: setting_firewall
      register: result
      ignore_errors: yes

    - assert:
        that:
          - result is failed
          - result is not changed
          - "'port' in result.msg"

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

---
- name: Verify error when present is missing in firewall_config for setting_firewall state
  block:
    - name: Configure firewall setting without present in firewall_config
      vios_secure:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vios_name: "{{ vios_name }}"
        firewall_config:
          - port: "{{ firewall_port }}"
        state: setting_firewall
      register: result
      ignore_errors: yes

    - assert:
        that:
          - result is failed
          - result is not changed
          - "'present' in result.msg"

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

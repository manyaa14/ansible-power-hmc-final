---
- name: Verify error when present value is invalid (not allow or deny) in firewall_config
  block:
    - name: Configure firewall setting with invalid present value
      vios_secure:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vios_name: "{{ vios_name }}"
        firewall_config:
          - port: "{{ firewall_port }}"
            interface: "{{ firewall_interface }}"
            remote: true
            address: "{{ firewall_address }}"
            timeout: "{{ firewall_timeout }}"
            present: check
        state: setting_firewall
      register: result
      ignore_errors: yes

    - assert:
        that:
          - result is failed
          - result is not changed
          - "'present' in result.msg"

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

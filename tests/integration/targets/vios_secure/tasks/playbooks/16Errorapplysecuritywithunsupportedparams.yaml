---
- name: Verify error when unsupported parameters are provided for setting_security state
  block:
    - name: Apply security with unsupported firewall_config param
      vios_secure:
        hmc_host: "{{ inventory_hostname }}"
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vios_name: "{{ vios_name }}"
        level: high
        firewall_config:
          - port: "{{ firewall_port }}"
            present: allow
        state: setting_security
      register: result
      ignore_errors: yes

    - assert:
        that:
          - result is failed
          - result is not changed
          - "'unsupported parameter' in result.msg"

  rescue:
    - name: Mark the testcase as failed
      debug:
        msg: "{{ Status_Fail }}"

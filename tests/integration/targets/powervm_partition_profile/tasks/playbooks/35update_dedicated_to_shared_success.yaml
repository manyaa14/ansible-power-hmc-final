- name: Verify update succeeds when switching from dedicated to shared with required fields
  block:
    - name: Update dedicated partition profile to shared with required processor values
      powervm_partition_profile:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name }}"
        name: "{{ profile_dedicated_basic }}"
        state: updated
        processor_settings: "{{ shared_processor_settings_update_processors_2 }}"
      register: testout

    - name: Stdout the dedicated-to-shared success response
      debug:
        msg: '{{ testout }}'

    - name: Verify dedicated-to-shared update succeeds
      assert:
        that:
          - testout is success
          - testout is changed
          - "'partition profile is updated successfully' in testout.profile_info.msg"

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"


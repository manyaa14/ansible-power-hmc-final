- name: Verify update succeeds when desired memory is changed
  block:
    - name: Update shared partition profile desired memory
      powervm_partition_profile:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name }}"
        name: "{{ profile_update_shared }}"
        state: updated
        memory_settings: "{{ memory_settings_update_shared_memory }}"
      register: testout

    - name: Stdout the update memory response
      debug:
        msg: '{{ testout }}'

    - name: Verify memory update succeeds
      assert:
        that:
          - testout is success
          - testout is changed
          - "'partition profile is updated successfully' in testout.profile_info.msg"

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"


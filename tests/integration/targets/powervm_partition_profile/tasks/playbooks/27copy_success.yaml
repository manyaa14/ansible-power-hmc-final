- name: Verify copy succeeds with valid parameters
  block:
    - name: Copy partition profile with valid parameters
      powervm_partition_profile:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name }}"
        name: "{{ profile_copy_source }}"
        duplicate_prof_name: "{{ profile_copy_duplicate }}"
        action: copy
      register: testout

    - name: Stdout the copy success response
      debug:
        msg: '{{ testout }}'

    - name: Verify copy succeeds
      assert:
        that:
          - testout is success
          - testout is changed
          - "'copy of' in testout.profile_info.msg"
          - "'partition profile is created successfully' in testout.profile_info.msg"

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"


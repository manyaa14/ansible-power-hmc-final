- name: Verify create fails when memory fields are incomplete
  block:
    - name: Create shared partition profile with incomplete memory settings
      powervm_partition_profile:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name }}"
        name: "{{ profile_shared_create_basic }}"
        state: present
        memory_settings:
          desired_memory: 1024
        processor_settings: "{{ shared_processor_settings_basic }}"
      register: testout
      ignore_errors: true

    - name: Stdout the incomplete memory response
      debug:
        msg: '{{ testout }}'

    - name: Verify shared memory required fields error is reported
      assert:
        that:
          - testout is failed
          - testout is not changed
          - "'Missing required memory_settings fields' in testout.msg"
          - "'minimum_memory' in testout.msg"
          - "'maximum_memory' in testout.msg"
          - "'desired_huge_pagecount' in testout.msg"
          - "'minimum_huge_pagecount' in testout.msg"
          - "'maximum_huge_pagecount' in testout.msg"

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"


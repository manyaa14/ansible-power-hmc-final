- name: Verify copy fails when duplicate profile name is missing
  block:
    - name: Copy partition profile without duplicate profile name
      powervm_partition_profile:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name }}"
        name: "{{ profile_copy_source }}"
        action: copy
      register: testout
      ignore_errors: true

    - name: Stdout the missing duplicate profile name response
      debug:
        msg: '{{ testout }}'

    - name: Verify missing duplicate profile name error is reported
      assert:
        that:
          - testout is failed
          - testout is not changed
          - "'duplicate_prof_name' in testout.msg"

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"


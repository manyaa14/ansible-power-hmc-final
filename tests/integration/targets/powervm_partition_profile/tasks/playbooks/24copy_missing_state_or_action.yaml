- name: Verify module fails when neither state nor action is provided
  block:
    - name: Run partition profile module without state or action
      powervm_partition_profile:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name }}"
        name: "{{ profile_copy_source }}"
      register: testout
      ignore_errors: true

    - name: Stdout the missing state or action response
      debug:
        msg: '{{ testout }}'

    - name: Verify missing state or action error is reported
      assert:
        that:
          - testout is failed
          - testout is not changed
          - "'one of the following is required: state, action' in testout.msg"

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"


- name: Verify uncapped shared profile creation succeeds
  block:
    - name: Create uncapped shared partition profile with uncapped_weight
      powervm_partition_profile:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name }}"
        name: "{{ profile_shared_uncapped }}"
        state: present
        memory_settings: "{{ memory_settings_basic }}"
        processor_settings: "{{ shared_processor_settings_uncapped }}"
      register: testout

    - name: Stdout the uncapped shared profile creation response
      debug:
        msg: '{{ testout }}'

    - name: Verify uncapped shared profile is created successfully
      assert:
        that:
          - testout is success
          - testout is changed
          - "'partition profile is created successfully' in testout.profile_info.msg"

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"


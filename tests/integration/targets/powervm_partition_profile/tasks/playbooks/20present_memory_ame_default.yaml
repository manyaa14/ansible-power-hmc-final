- name: Verify profile creation succeeds with active memory expansion default factor
  block:
    - name: Create shared partition profile with active memory expansion enabled
      powervm_partition_profile:
        hmc_host: '{{ inventory_hostname }}'
        hmc_auth: "{{ curr_hmc_auth }}"
        system_name: "{{ system_name }}"
        vm_name: "{{ vm_name }}"
        name: "{{ profile_memory_ame_default }}"
        state: present
        memory_settings: "{{ memory_settings_ame_default }}"
        processor_settings: "{{ shared_processor_settings_pool }}"
      register: testout

    - name: Stdout the active memory expansion default response
      debug:
        msg: '{{ testout }}'

    - name: Verify profile is created successfully with active memory expansion enabled
      assert:
        that:
          - testout is success
          - testout is changed
          - "'partition profile is created successfully' in testout.profile_info.msg"

  rescue:
    - name: Mark the testcase as FAILED
      debug:
        msg: "{{ Status_Fail }}"


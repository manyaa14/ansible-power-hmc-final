---
# =============================================================================
# On Jenkins: all values are injected as environment variables via withCredentials.
# Locally: set the corresponding env vars before running, or replace with
#          literal values (do NOT commit real secrets to git).
# =============================================================================

# Bearer token for OneCloud API authentication for VM provisioning
# Jenkins credential ID: ansible_fvtr_bearer_token  (Secret text)
bearer_token: "{{ lookup('env', 'BEARER_TOKEN') }}"

# Default root password for vHMC
# Jenkins credential ID: ansible_fvtr_root_pass  (Secret text)
root_pass: "{{ lookup('env', 'ROOT_PASS') }}"

# Default password for hscpe user
# Used for: Deploying and running Asterix emulator
# Jenkins credential ID: ansible_fvtr_hscpe_pass  (Secret text)
hscpe_pass: "{{ lookup('env', 'HSCPE_PASS') }}"

# Root password for managed system (emulated system)
# Used for: Managed system operations in Asterix emulator
# Jenkins credential ID: ansible_fvtr_asterix_root_pass  (Secret text)
asterix_root_pass: "{{ lookup('env', 'ASTERIX_ROOT_PASS') }}"

# GitHub username (IBM email address)
# Jenkins credential ID: 714e4cc7-71d2-460f-9e35-e9d7e285d6d1  (csnextGitHubCredentials - usernameVariable)
github_username: "{{ lookup('env', 'GITHUB_USERNAME') }}"

# GitHub Personal Access Token (PAT)
# Jenkins credential ID: 714e4cc7-71d2-460f-9e35-e9d7e285d6d1  (csnextGitHubCredentials - passwordVariable)
github_token: "{{ lookup('env', 'GITHUB_TOKEN') }}"

# Gradle/Artifactory username (IBM email address)
# Jenkins credential ID: 8c4dfec9-ef7f-4b64-85bb-a9679a64bba3  (csnextCredentials - usernameVariable)
artifactory_username: "{{ lookup('env', 'ARTIFACTORY_USERNAME') }}"

# Gradle/Artifactory API token
# Used to: Download dependencies during Gradle build process for building asterix emulator
# Jenkins credential ID: 8c4dfec9-ef7f-4b64-85bb-a9679a64bba3  (csnextCredentials - passwordVariable)
artifactory_token: "{{ lookup('env', 'ARTIFACTORY_TOKEN') }}"
